<script>
    // 🌓 كود تشغيل زرار التحويل بين الدارك واللايت مود
    const themeToggleBtn = document.getElementById('theme-toggle');
    
    themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        
        if (currentTheme === 'light') {
            document.documentElement.removeAttribute('data-theme');
            themeToggleBtn.innerText = "🌙 Dark mode";
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            themeToggleBtn.innerText = "☀️ Light mode";
        }
    });

    // 💾 تحميل بيانات المستخدم المحفوظة فور فتح الصفحة
    document.addEventListener('DOMContentLoaded', () => {
        const savedUsername = localStorage.getItem('saved_username');
        const savedPassword = localStorage.getItem('saved_password');

        if (savedUsername) document.getElementById('username').value = savedUsername;
        if (savedPassword) document.getElementById('password').value = savedPassword;
    });

    // 📝 كود إرسال الفورم للـ Webhook وحفظ البيانات
    document.getElementById('qa-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const responseBox = document.getElementById('response-box');
        const aiOutput = document.getElementById('ai-output');
        
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const lessonPartInput = document.getElementById('lesson-part');
        const questionInput = document.getElementById('question');

        // حفظ اليوزر نيم والباسوورد في ذاكرة المتصفح localStroage
        localStorage.setItem('saved_username', usernameInput.value);
        localStorage.setItem('saved_password', passwordInput.value);

        btn.innerText = "Processing your question... ⏳";
        btn.disabled = true;

        const payload = {
            username: usernameInput.value,
            password: passwordInput.value,
            lesson_part: lessonPartInput.value,
            question: questionInput.value
        };

        try {
            const webhookUrl = "https://n8n.sciencetoonz.com/webhook/Nsession-sat"; 
            
            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            responseBox.classList.remove('hidden');
            aiOutput.innerText = data.output || "Question processed!";

            // تفريغ خانة السؤال وجزء الدرس فقط، مع الإبقاء على اليوزر نيم والباسوورد
            questionInput.value = '';
            
        } catch (error) {
            alert('Something went wrong, please try again.');
        } finally {
            btn.innerText = "Ask Mr. Harony";
            btn.disabled = false;
        }
    });
</script>
