<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Session 01 - Sciencetoonz</title>
    <style>
        /* تعريف الألوان كمتغيرات لسهولة التحويل */
        :root {
            --bg-body: #1e2230;
            --bg-container: #111420;
            --bg-input: #181c2e;
            --border-input: #272d4a;
            --text-main: #ffffff;
            --text-footer: #545d82;
            --bg-response: #1c2035;
        }

        /* ألوان المود الفاتح (Light Mode) */
        [data-theme="light"] {
            --bg-body: #f0f2f5;
            --bg-container: #ffffff;
            --bg-input: #f8f9fa;
            --border-input: #ced4da;
            --text-main: #212529;
            --text-footer: #6c757d;
            --bg-response: #e9ecef;
        }

        /* تنسيق الألوان الأساسية والخلفية */
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--bg-container);
            width: 100%;
            max-width: 700px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: background-color 0.3s;
        }

        /* الهيدر والعنوان */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            font-weight: bold;
        }

        /* تنسيق زرار تحويل المود */
        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-input);
            color: #ffb703;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            width: auto; /* إلغاء خاصية الـ 100% للزرار ده */
            font-weight: normal;
            transition: background-color 0.3s;
        }

        .theme-toggle-btn:hover {
            background-color: var(--bg-input);
        }

        /* 📺 مربع فيديو اليوتيوب المتجاوب */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* جعل الحقول بجانب بعضها في سطر واحد */
        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .row .input-group {
            flex: 1;
            margin-bottom: 0;
        }

        /* تنسيق حقول المدخلات */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
            transition: border 0.3s, background-color 0.3s, color 0.3s;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: #5865f2;
            outline: none;
        }

        /* الزرار الأزرق للإرسال */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #5865f2;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #4752c4;
        }

        .submit-btn:disabled {
            background-color: #3c4270;
            cursor: not-allowed;
        }

        /* صندوق الإجابة */
        .response-container {
            background-color: var(--bg-response);
            border-left: 4px solid #5865f2;
            padding: 15px;
            border-radius: 6px;
            margin-top: 25px;
        }

        .hidden {
            display: none;
        }

        /* الفوتر */
        .footer {
            text-align: center;
            color: var(--text-footer);
            font-size: 12px;
            margin-top: 25px;
        }

        /* شاشات الموبايل الصغيرة */
        @media (max-width: 480px) {
            .row {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- العنوان الرئيسي وزرار التحويل -->
        <div class="header">
            <h1>Ask Mr. Harony</h1>
            <button id="theme-toggle" class="theme-toggle-btn">🌙 Dark mode</button>
        </div>

        <!-- 📺 مربع فيديو يوتيوب المتجاوب -->
        <div class="video-wrapper">
            <iframe 
                id="lesson-video"
                src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- 📝 فورم إرسال الأسئلة للـ Webhook -->
        <form id="qa-form">
            
            <div class="row">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="email" id="username" placeholder="JamesBond@gmail.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••••••" required>
                </div>
            </div>

            <div class="input-group">
                <label for="lesson-part">Part of the lesson</label>
                <input type="text" id="lesson-part" placeholder="e.g. Part 1 or Q 03-b" required>
            </div>

            <div class="input-group">
                <label for="question">Your Question</label>
                <textarea id="question" rows="5" placeholder="Type your question here regarding the lesson part..." required></textarea>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">Ask Mr. Harony</button>
        </form>

        <!-- صندوق ظهور إجابة الـ AI للطالب مباشرة هنا -->
        <div id="response-box" class="response-container hidden">
            <h3>🤖 Assistant Response:</h3>
            <div id="ai-output"></div>
        </div>

        <div class="footer">
            Secure academic assistant • Mr. Harony
        </div>
    </div>

    <script>
        // 🌓 كود تشغيل زرار التحويل بين الدارك واللايت مود
        const themeToggleBtn = document.getElementById('theme-toggle');
        
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                themeToggleBtn.innerText = "🌙 Dark mode";
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggleBtn.innerText = "☀️ Light mode";
            }
        });

        // 📝 كود إرسال الفورم للـ Webhook
        document.getElementById('qa-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const responseBox = document.getElementById('response-box');
            const aiOutput = document.getElementById('ai-output');
            
            btn.innerText = "Processing your question... ⏳";
            btn.disabled = true;

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                lesson_part: document.getElementById('lesson-part').value,
                question: document.getElementById('question').value
            };

            try {
                const webhookUrl = 'رابط_الـ_Webhook_بتاعك_هنا'; 
                
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                responseBox.classList.remove('hidden');
                aiOutput.innerText = data.output || "Question processed!";
            } catch (error) {
                alert('Something went wrong, please try again.');
            } finally {
                btn.innerText = "Ask Mr. Harony";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
