<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدقق وموحد بيانات أرقام الهواتف | Data Fix</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --neutral: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* لوحة التحكم والبحث */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.2fr;
      gap: 16px;
      margin-bottom: 24px;
      align-items: flex-end;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: #0b1120;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus, 
    .form-group select:focus {
      border-color: var(--primary);
    }

    button.btn-search {
      padding: 11px 20px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: #0b1120;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.btn-search:hover {
      opacity: 0.9;
    }

    /* شريط ملخص الحالة للطالب */
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .student-info {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .sync-badge {
      padding: 6px 16px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .status-synchronized {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status-mismatch {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    /* جدول عرض السجلات */
    .table-container {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    th {
      background: #162032;
      color: var(--text-muted);
      font-weight: 600;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* وسوم الحالة */
    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .tag-match { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .tag-mismatch { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .tag-notfound { background: rgba(100, 116, 139, 0.2); color: var(--neutral); }

    /* حقل التعديل والزر */
    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action-input {
      background: #0b1120;
      border: 1px solid var(--border-color);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 150px;
      outline: none;
    }

    .action-input:focus {
      border-color: var(--primary);
    }

    .btn-save {
      background: var(--success);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-save:hover {
      opacity: 0.9;
    }

    .btn-save:disabled, 
    .action-input:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .loading-spinner {
      display: none;
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>مدقق وموحد بيانات أرقام الهواتف (Data Harmonizer)</h1>
    <p class="subtitle">فحص السجلات عبر الماستر شيت وجداول الكريدينشيال وشيتات الأسابيع وتصحيحها</p>
  </header>

  <!-- صندوق البحث والخيارات -->
  <div class="controls-panel">
    <div class="form-group">
      <label for="serialInput">سيريال / كود الطالب</label>
      <input type="text" id="serialInput" placeholder="أدخل سيريال الطالب..." required>
    </div>

    <div class="form-group">
      <label for="targetType">الرقم المستهدف للتدقيق</label>
      <select id="targetType">
        <option value="student_phone">هاتف الطالب (Student Phone)</option>
        <option value="parent_phone">هاتف ولي الأمر (Parent Phone)</option>
      </select>
    </div>

    <button class="btn-search" onclick="runAudit()">فحص وتدقيق (Audit)</button>
  </div>

  <!-- حالة التحميل -->
  <div id="loading" class="loading-spinner">جاري سحب البيانات ومطابقتها من الخادم...</div>

  <!-- شريط ملخص الطالب -->
  <div id="summaryArea" class="summary-card" style="display: none;">
    <div class="student-info">
      <span style="color: var(--text-muted); font-size: 0.9rem; font-weight: normal;">اسم الطالب: </span>
      <span id="studentNameDisplay"></span>
    </div>
    <div id="overallStatusBadge" class="sync-badge"></div>
  </div>

  <!-- جدول عرض المصادر والنتائج -->
  <div class="table-container" id="tableWrapper" style="display: none;">
    <table>
      <thead>
        <tr>
          <th>المصدر (Source)</th>
          <th>نوع المصدر</th>
          <th>الرقم المسجل حالياً</th>
          <th>الحالة</th>
          <th>التعديل والحفظ الفوري</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // استبدل هذين الرابطين بروابط الـ Production Webhook الخاصة بك في n8n عند التفعيل
  const AUDIT_WEBHOOK_URL = 'https://YOUR-N8N-DOMAIN.com/webhook/audit-records';
  const UPDATE_WEBHOOK_URL = 'https://YOUR-N8N-DOMAIN.com/webhook/update-record';

  // 1. استدعاء تدقيق البيانات
  async function runAudit() {
    const serial = document.getElementById('serialInput').value.trim();
    const targetType = document.getElementById('targetType').value;

    if (!serial) {
      alert('يرجى كتابة سيريال الطالب أولاً');
      return;
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('summaryArea').style.display = 'none';
    document.getElementById('tableWrapper').style.display = 'none';

    try {
      const response = await fetch(AUDIT_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          studentserial: serial,
          target_type: targetType
        })
      });

      if (!response.ok) throw new Error('فشل الاتصال بالخادم');

      const data = await response.json();
      renderTable(data);
    } catch (err) {
      alert('حدث خطأ أثناء فحص البيانات. تأكد من تفعيل Webhook في n8n وصحة الرابط.');
      console.error(err);
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  // 2. رسم الجدول وعرض النتائج
  function renderTable(payload) {
    const { student_name, records, all_synchronized } = payload;

    document.getElementById('studentNameDisplay').innerText = student_name || 'غير محدد';

    const statusBadge = document.getElementById('overallStatusBadge');
    if (all_synchronized) {
      statusBadge.innerText = 'All Synchronized (متطابق)';
      statusBadge.className = 'sync-badge status-synchronized';
    } else {
      statusBadge.innerText = 'Mismatch (يوجد تعارض)';
      statusBadge.className = 'sync-badge status-mismatch';
    }

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    records.forEach(rec => {
      const isNotFound = rec.status === 'Not Found';
      const isMatch = rec.status === 'Match';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${rec.source_name}</strong></td>
        <td><span style="color: var(--text-muted);">${rec.source_type}</span></td>
        <td><code>${rec.recorded_phone || '---'}</code></td>
        <td>
          <span class="tag ${isNotFound ? 'tag-notfound' : isMatch ? 'tag-match' : 'tag-mismatch'}">
            ${rec.status}
          </span>
        </td>
        <td>
          <div class="action-group">
            <input 
              type="text" 
              class="action-input" 
              id="input-${rec.source_id}" 
              value="${rec.recorded_phone || ''}" 
              ${isNotFound ? 'disabled' : ''} 
            />
            <button 
              class="btn-save" 
              onclick="saveRecord('${rec.source_type}', '${rec.source_id}')" 
              ${isNotFound ? 'disabled' : ''}>
              حفظ
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('summaryArea').style.display = 'flex';
    document.getElementById('tableWrapper').style.display = 'block';
  }

  // 3. إرسال أمر التحديث عند الضغط على حفظ
  async function saveRecord(tableType, sourceId) {
    const serial = document.getElementById('serialInput').value.trim();
    const targetType = document.getElementById('targetType').value;
    const newPhone = document.getElementById(`input-${sourceId}`).value.trim();

    if (!newPhone) {
      alert('يرجى كتابة رقم الهاتف قبل الحفظ');
      return;
    }

    try {
      const response = await fetch(UPDATE_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          studentserial: serial,
          target_type: targetType,
          table_type: tableType,
          source_id: sourceId,
          new_phone: newPhone
        })
      });

      const result = await response.json();
      if (result.success) {
        alert('تم تحديث الرقم بنجاح');
        runAudit(); // إعادة الفحص تلقائياً لتحديث شريط التوافق والألوان
      } else {
        alert('لم تتم العملية: ' + (result.message || 'خطأ غير معروف'));
      }
    } catch (err) {
      alert('حدث خطأ أثناء محاولة التحديث');
      console.error(err);
    }
  }
</script>

</body>
</html>
