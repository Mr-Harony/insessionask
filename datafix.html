<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Fix</title>
  <style>
    :root {
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary-blue: #2c5282;
      --border-color: #e2e8f0;
      --btn-blue: #3182ce;
      --btn-blue-hover: #2b6cb0;
      --sync-bg: #dcfce7;
      --sync-border: #86efac;
      --sync-text: #166534;
      --mismatch-bg: #fee2e2;
      --mismatch-border: #fca5a5;
      --mismatch-text: #991b1b;
      --badge-match-bg: #38a169;
      --badge-mismatch-bg: #e53e3e;
      --badge-notfound-bg: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .main-wrapper {
      width: 100%;
      max-width: 950px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1.main-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-blue);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p.sub-title {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* Form Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      margin-bottom: 20px;
    }

    .controls-row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }

    .input-serial {
      flex: 2;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      color: var(--text-main);
    }

    .input-serial:focus {
      border-color: var(--primary-blue);
    }

    .select-target {
      flex: 1.2;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      background-color: #fff;
      color: var(--text-main);
      cursor: pointer;
    }

    .btn-audit {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-blue);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-audit:hover {
      background-color: #1a365d;
    }

    /* Alert / Sync Bar */
    .sync-alert {
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }

    .sync-alert.synchronized {
      display: block;
      background-color: var(--sync-bg);
      border: 1px solid var(--sync-border);
      color: var(--sync-text);
    }

    .sync-alert.mismatch {
      display: block;
      background-color: var(--mismatch-bg);
      border: 1px solid var(--mismatch-border);
      color: var(--mismatch-text);
    }

    /* Duplicate Alert Bar */
    .duplicate-alert {
      display: none;
      background-color: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* Student Title */
    .student-header {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 12px;
      display: none;
    }

    /* Credentials Info Box */
    .credentials-card {
      display: none;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .credentials-card span {
      margin-right: 24px;
    }

    .credentials-card code {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background-color: #e2e8f0;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.88rem;
      color: #0f172a;
      font-weight: 600;
    }

    /* Table */
    .table-container {
      display: none;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead th {
      background-color: #f1f5f9;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    tbody td {
      padding: 16px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .source-name {
      font-weight: 700;
      color: #0f172a;
    }

    .source-type {
      color: var(--text-muted);
    }

    .phone-text {
      font-size: 0.9rem;
      color: #334155;
    }

    /* Badges */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: capitalize;
    }

    .badge-match {
      background-color: var(--badge-match-bg);
    }

    .badge-mismatch {
      background-color: var(--badge-mismatch-bg);
    }

    .badge-notfound {
      background-color: var(--badge-notfound-bg);
    }

    /* Action Cell */
    .action-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 150px;
    }

    .input-edit {
      padding: 6px 10px;
      font-size: 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      color: var(--text-main);
    }

    .input-edit:focus {
      border-color: var(--btn-blue);
    }

    .btn-save-record {
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--btn-blue);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      align-self: flex-start;
      transition: background 0.2s;
    }

    .btn-save-record:hover {
      background-color: var(--btn-blue-hover);
    }

    .input-edit:disabled,
    .btn-save-record:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .loading-state {
      display: none;
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <!-- عنوان الصفحة -->
  <header>
    <h1 class="main-title">Data Fix</h1>
    <p class="sub-title">Cross-Sheet Phone Number Auditor & Data Harmonizer</p>
  </header>

  <div class="card">
    <!-- صندوق الفحص والخيارات -->
    <div class="controls-row">
      <input type="text" id="serialInput" class="input-serial" placeholder="Insert Student Serial" required>
      <select id="targetType" class="select-target">
        <option value="parent_phone">Parent Phone</option>
        <option value="student_phone">Student Phone</option>
      </select>
      <button class="btn-audit" onclick="runAudit()">Audit Records</button>
    </div>

    <!-- شريط حالة التحميل -->
    <div id="loading" class="loading-state">Auditing records across tables...</div>

    <!-- شريط التوافق الأخضر / الأحمر -->
    <div id="syncAlert" class="sync-alert"></div>

    <!-- تنبيه السجلات المكررة -->
    <div id="duplicateAlert" class="duplicate-alert">
      ⚠️ Notice: Multiple duplicate records detected for this student serial in Credentials table.
    </div>

    <!-- عنوان اسم الطالب مع السيريال -->
    <div id="studentHeader" class="student-header"></div>

    <!-- بطاقة عرض بيانات تسجيل الدخول -->
    <div id="credentialsCard" class="credentials-card">
      <span><strong>Username:</strong> <code id="dispUsername">---</code></span>
      <span><strong>Password:</strong> <code id="dispPassword" style="color: #0369a1;">---</code></span>
    </div>

    <!-- جدول عرض البيانات والمصادر -->
    <div class="table-container" id="tableContainer">
      <table>
        <thead>
          <tr>
            <th>Sheet / Table Source</th>
            <th>Source Type</th>
            <th>Recorded Phone Number</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // روابط الـ Webhook المباشرة الخاصة بك على n8n
  const AUDIT_WEBHOOK_URL = 'https://n8n.sciencetoonz.com/webhook/audit-phones';
  const UPDATE_WEBHOOK_URL = 'https://n8n.sciencetoonz.com/webhook/update-phone';

  // 1. استدعاء تدقيق البيانات
  async function runAudit() {
    const serial = document.getElementById('serialInput').value.trim();
    const targetType = document.getElementById('targetType').value;

    if (!serial) {
      alert('Please enter a student serial.');
      return;
    }

    const loading = document.getElementById('loading');
    const syncAlert = document.getElementById('syncAlert');
    const duplicateAlert = document.getElementById('duplicateAlert');
    const studentHeader = document.getElementById('studentHeader');
    const credentialsCard = document.getElementById('credentialsCard');
    const tableContainer = document.getElementById('tableContainer');

    loading.style.display = 'block';
    syncAlert.style.display = 'none';
    duplicateAlert.style.display = 'none';
    studentHeader.style.display = 'none';
    credentialsCard.style.display = 'none';
    tableContainer.style.display = 'none';

    try {
      const response = await fetch(AUDIT_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          studentserial: serial,
          target_type: targetType
        })
      });

      if (!response.ok) throw new Error('Network error');

      const data = await response.json();
      renderUI(data, serial);
    } catch (err) {
      alert('Error fetching data from n8n. Please check Webhook status and CORS.');
      console.error(err);
    } finally {
      loading.style.display = 'none';
    }
  }

  // 2. رسم الجدول وعرض البيانات بنفس تصميم الصورة
  function renderUI(payload, serial) {
    const { student_name, username, password, has_duplicates, records, all_synchronized } = payload;

    const syncAlert = document.getElementById('syncAlert');
    const duplicateAlert = document.getElementById('duplicateAlert');
    const studentHeader = document.getElementById('studentHeader');
    const credentialsCard = document.getElementById('credentialsCard');
    const dispUsername = document.getElementById('dispUsername');
    const dispPassword = document.getElementById('dispPassword');
    const tableContainer = document.getElementById('tableContainer');
    const tbody = document.getElementById('tableBody');

    // ضبط نص شريط المزامنة
    if (all_synchronized) {
      syncAlert.className = 'sync-alert synchronized';
      syncAlert.innerText = 'All synchronized: Phone number is identical across all inspected tables.';
    } else {
      syncAlert.className = 'sync-alert mismatch';
      syncAlert.innerText = 'Mismatch detected: Phone numbers are not identical across all inspected tables.';
    }

    // إظهار تنبيه التكرار إذا وُجد
    if (has_duplicates) {
      duplicateAlert.style.display = 'block';
    } else {
      duplicateAlert.style.display = 'none';
    }

    // عرض اسم وسيريال الطالب
    studentHeader.innerText = `Student: (${serial}) ${student_name || ''}`;
    studentHeader.style.display = 'block';

    // عرض بيانات تسجيل الدخول
    if (username || password) {
      dispUsername.innerText = username || '---';
      dispPassword.innerText = password || '---';
      credentialsCard.style.display = 'block';
    } else {
      credentialsCard.style.display = 'none';
    }

    // تعبئة صفوف الجدول
    tbody.innerHTML = '';
    records.forEach((rec, idx) => {
      const isNotFound = rec.status === 'Not Found';
      const isMatch = rec.status === 'Match';

      let badgeClass = 'badge-mismatch';
      if (isMatch) badgeClass = 'badge-match';
      if (isNotFound) badgeClass = 'badge-notfound';

      const rowInputId = `input-field-${idx}`;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="source-name">${rec.source_name}</span></td>
        <td><span class="source-type">${rec.source_type}</span></td>
        <td><span class="phone-text">${rec.recorded_phone || ''}</span></td>
        <td>
          <span class="status-badge ${badgeClass}">${rec.status}</span>
        </td>
        <td>
          <div class="action-container">
            <input 
              type="text" 
              class="input-edit" 
              id="${rowInputId}" 
              value="${(!isNotFound && rec.recorded_phone !== '---') ? rec.recorded_phone : ''}" 
              ${isNotFound ? 'disabled' : ''} 
            />
            <button 
              class="btn-save-record" 
              onclick="saveRecord('${rec.source_type}', '${rec.source_id}', '${rowInputId}', this)" 
              ${isNotFound ? 'disabled' : ''}>
              Save
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    tableContainer.style.display = 'block';
  }

  // 3. إرسال أمر التحديث عند الضغط على Save
  async function saveRecord(tableType, sourceId, inputId, btnElem) {
    const serial = document.getElementById('serialInput').value.trim();
    const targetType = document.getElementById('targetType').value;
    const newPhone = document.getElementById(inputId).value.trim();

    if (!newPhone) {
      alert('Please enter a valid phone number.');
      return;
    }

    const originalText = btnElem.innerText;
    btnElem.innerText = 'Saving...';
    btnElem.disabled = true;

    try {
      const response = await fetch(UPDATE_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          studentserial: serial,
          target_type: targetType,
          table_type: tableType,
          source_id: sourceId,
          new_phone: newPhone
        })
      });

      const result = await response.json();
      if (result.success || response.ok) {
        btnElem.innerText = 'Saved!';
        setTimeout(() => {
          runAudit(); // إعادة الفحص تلقائياً لتحديث الحالة بعد التعديل
        }, 600);
      } else {
        alert('Update failed: ' + (result.message || 'Unknown error'));
        btnElem.innerText = originalText;
        btnElem.disabled = false;
      }
    } catch (err) {
      alert('Error updating record.');
      console.error(err);
      btnElem.innerText = originalText;
      btnElem.disabled = false;
    }
  }
</script>

</body>
</html>
