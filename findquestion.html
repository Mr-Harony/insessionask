<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Question Finder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px 16px;
      cursor: pointer;
      position: relative;
      background-color: #f8fafc;
      transition: border-color 0.2s, background-color 0.2s;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .upload-area:hover {
      border-color: #3b82f6;
      background-color: #eff6ff;
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      stroke: #64748b;
      margin-bottom: 12px;
    }

    .upload-text {
      color: #334155;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .upload-hint {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }

    .upload-hint kbd {
      background-color: #e2e8f0;
      color: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      border: 1px solid #cbd5e1;
    }

    #imageInput {
      display: none;
    }

    #previewImage {
      display: none;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 8px;
    }

    .btn-find {
      width: 100%;
      margin-top: 20px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      transition: background-color 0.2s;
    }

    .btn-find:hover {
      background-color: #1d4ed8;
    }

    .btn-find:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    #resultBox {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-weight: 600;
      font-size: 16px;
      display: none;
      text-align: center;
      direction: ltr;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="container">
    <label class="upload-area" for="imageInput" id="dropArea">
      <div id="placeholder">
        <svg class="upload-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
        </svg>
        <div class="upload-text">التقط صورة السؤال أو اضغط للصق</div>
        <div class="upload-hint">أو اضغط <kbd>Ctrl</kbd> + <kbd>V</kbd> للصق لقطة الشاشة مباشرة</div>
      </div>
      <img id="previewImage" alt="معاينة السؤال">
    </label>

    <input type="file" id="imageInput" accept="image/*" capture="environment">

    <button class="btn-find" id="findBtn">Find this exam</button>

    <div id="resultBox"></div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const previewImage = document.getElementById('previewImage');
    const placeholder = document.getElementById('placeholder');
    const findBtn = document.getElementById('findBtn');
    const resultBox = document.getElementById('resultBox');

    const WEBHOOK_URL = "https://n8n.sciencetoonz.com/webhook/findquestion";

    // متغير لتخزين الملف الحالي سواء جاء من الكاميرا أو اللصق (Paste)
    let selectedFile = null;

    function handleImageFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      selectedFile = file;

      const reader = new FileReader();
      reader.onload = function (e) {
        previewImage.src = e.target.result;
        previewImage.style.display = 'block';
        placeholder.style.display = 'none';
        resultBox.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    // 1. التقاط أو اختيار من الجهاز عبر زر الاختيار
    imageInput.addEventListener('change', function () {
      if (this.files && this.files[0]) {
        handleImageFile(this.files[0]);
      }
    });

    // 2. استقبال اللصق المباشر (Ctrl + V / Paste) في أي مكان بالصفحة
    window.addEventListener('paste', function (e) {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          handleImageFile(blob);
          break;
        }
      }
    });

    // 3. إرسال الصورة إلى الـ Webhook
    findBtn.addEventListener('click', async function () {
      if (!selectedFile) {
        alert('من فضلك التقط أو الصق صورة السؤال أولاً.');
        return;
      }

      const formData = new FormData();
      formData.append('file', selectedFile, selectedFile.name || 'pasted-question.png');

      findBtn.disabled = true;
      findBtn.innerText = 'Searching...';
      resultBox.style.display = 'none';

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('فشل الاتصال بالخادم (' + response.status + ')');
        }

        const data = await response.json();
        
        resultBox.style.display = 'block';
        resultBox.innerText = data.result || data.message || JSON.stringify(data);

      } catch (error) {
        alert('حدث خطأ أثناء الاتصال: ' + error.message);
      } finally {
        findBtn.disabled = false;
        findBtn.innerText = 'Find this exam';
      }
    });
  </script>

</body>
</html>
