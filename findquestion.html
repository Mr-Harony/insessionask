<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Question Finder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
      position: relative;
    }

    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px 16px;
      cursor: pointer;
      position: relative;
      background-color: #f8fafc;
      transition: border-color 0.2s, background-color 0.2s;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    .upload-area:hover {
      border-color: #3b82f6;
      background-color: #eff6ff;
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      stroke: #64748b;
      margin-bottom: 12px;
    }

    .upload-text {
      color: #334155;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .upload-hint {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }

    .upload-hint kbd {
      background-color: #e2e8f0;
      color: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      border: 1px solid #cbd5e1;
    }

    #imageInput {
      display: none;
    }

    #previewImage {
      display: none;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 8px;
    }

    .btn-find {
      width: 100%;
      margin-top: 20px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      transition: background-color 0.2s;
    }

    .btn-find:hover {
      background-color: #1d4ed8;
    }

    .btn-find:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    #resultBox {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-weight: 600;
      font-size: 16px;
      display: none;
      text-align: center;
      direction: ltr;
      word-break: break-word;
    }

    /* تصميم قائمة الكليك يمين */
    .context-menu {
      display: none;
      position: fixed;
      z-index: 1000;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      min-width: 180px;
      padding: 6px 0;
      text-align: right;
    }

    .context-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      font-size: 13.5px;
      color: #1e293b;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .context-menu-item:hover {
      background-color: #f1f5f9;
      color: #2563eb;
    }

    .context-menu-item svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .context-menu-separator {
      height: 1px;
      background-color: #f1f5f9;
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="upload-area" id="dropArea">
      <div id="placeholder">
        <svg class="upload-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
        </svg>
        <div class="upload-text">التقط صورة السؤال أو اضغط للصق</div>
        <div class="upload-hint">انقر بالزر الأيمن للخيارات، أو <kbd>Ctrl</kbd> + <kbd>V</kbd></div>
      </div>
      <img id="previewImage" alt="معاينة السؤال">
    </div>

    <input type="file" id="imageInput" accept="image/*" capture="environment">

    <button class="btn-find" id="findBtn">Find this exam</button>

    <div id="resultBox"></div>
  </div>

  <!-- قائمة الكليك يمين المخصصة -->
  <div class="context-menu" id="contextMenu">
    <div class="context-menu-item" id="menuPaste">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      لصق الصورة (Paste)
    </div>
    <div class="context-menu-item" id="menuUpload">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
      اختيار / التقاط ملف
    </div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" id="menuClear" style="color: #ef4444;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      حذف الصورة
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const previewImage = document.getElementById('previewImage');
    const placeholder = document.getElementById('placeholder');
    const findBtn = document.getElementById('findBtn');
    const resultBox = document.getElementById('resultBox');
    const dropArea = document.getElementById('dropArea');
    const contextMenu = document.getElementById('contextMenu');

    const menuPaste = document.getElementById('menuPaste');
    const menuUpload = document.getElementById('menuUpload');
    const menuClear = document.getElementById('menuClear');

    const WEBHOOK_URL = "https://n8n.sciencetoonz.com/webhook/findquestion";

    let selectedFile = null;

    function handleImageFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      selectedFile = file;

      const reader = new FileReader();
      reader.onload = function (e) {
        previewImage.src = e.target.result;
        previewImage.style.display = 'block';
        placeholder.style.display = 'none';
        resultBox.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      selectedFile = null;
      imageInput.value = '';
      previewImage.src = '';
      previewImage.style.display = 'none';
      placeholder.style.display = 'flex';
      resultBox.style.display = 'none';
    }

    // النقر المباشر باليسار يفتح الكاميرا/الملفات
    dropArea.addEventListener('click', function () {
      imageInput.click();
    });

    imageInput.addEventListener('change', function () {
      if (this.files && this.files[0]) {
        handleImageFile(this.files[0]);
      }
    });

    // لصق عام عبر لوحة المفاتيح
    window.addEventListener('paste', function (e) {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          handleImageFile(blob);
          break;
        }
      }
    });

    // إظهار قائمة الكليك يمين عند النقر بالزر الأيمن على المربع
    dropArea.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      contextMenu.style.display = 'block';
      contextMenu.style.left = e.clientX + 'px';
      contextMenu.style.top = e.clientY + 'px';
    });

    // إخفاء القائمة عند النقر في أي مكان آخر
    window.addEventListener('click', function () {
      contextMenu.style.display = 'none';
    });

    // أحداث خيارات القائمة
    menuUpload.addEventListener('click', function (e) {
      e.stopPropagation();
      contextMenu.style.display = 'none';
      imageInput.click();
    });

    menuPaste.addEventListener('click', async function (e) {
      e.stopPropagation();
      contextMenu.style.display = 'none';
      try {
        const clipboardItems = await navigator.clipboard.read();
        for (const item of clipboardItems) {
          const imageType = item.types.find(type => type.startsWith('image/'));
          if (imageType) {
            const blob = await item.getType(imageType);
            handleImageFile(blob);
            return;
          }
        }
        alert('لم يتم العثور على صورة في الحافظة. انسخ صورة أولاً ثم اختر لصق.');
      } catch (err) {
        alert('يرجى استخدام اختصار Ctrl + V إذا لم يمنح المتصفح إذن قراءة الحافظة.');
      }
    });

    menuClear.addEventListener('click', function (e) {
      e.stopPropagation();
      contextMenu.style.display = 'none';
      clearImage();
    });

    // زر البحث
    findBtn.addEventListener('click', async function () {
      if (!selectedFile) {
        alert('من فضلك التقط أو الصق صورة السؤال أولاً.');
        return;
      }

      const formData = new FormData();
      formData.append('file', selectedFile, selectedFile.name || 'question.png');

      findBtn.disabled = true;
      findBtn.innerText = 'Searching...';
      resultBox.style.display = 'none';

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('فشل الاتصال بالخادم (' + response.status + ')');
        }

        const data = await response.json();
        resultBox.style.display = 'block';
        resultBox.innerText = data.result || data.message || JSON.stringify(data);

      } catch (error) {
        alert('حدث خطأ أثناء الاتصال: ' + error.message);
      } finally {
        findBtn.disabled = false;
        findBtn.innerText = 'Find this exam';
      }
    });
  </script>

</body>
</html>
