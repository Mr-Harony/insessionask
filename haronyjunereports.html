<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr. Harony | Weekly Reports</title>
  <style>
    :root {
      --bg-color: #1a1d29;
      --card-bg: #242838;
      --input-bg: #1a1d29;
      --border-color: #383e56;
      --text-main: #f0f2f5;
      --text-muted: #8c93b0;
      --primary: #4f6ef7;
      --primary-hover: #3d5be0;
      --success: #10b981;
      --danger: #ef4444;
      --section-bg: #1f2333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 16px 12px;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 520px;
      border-radius: 14px;
      padding: 20px 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      height: fit-content;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group {
      flex: 1;
      min-width: 0;
    }

    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 12px 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    select {
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.4;
    }

    /* Container التقرير بالكامل */
    .report-card {
      display: none;
      margin-top: 20px;
    }

    .report-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .report-top-bar h3 {
      font-size: 1.1rem;
      color: var(--primary);
    }

    .btn-print {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    /* أقسام التقرير (Sections) */
    .report-section {
      background-color: var(--section-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-body {
      font-size: 0.92rem;
      color: var(--text-main);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* كارت الحضور والمشاركة للحصص الثلاث */
    .sessions-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .session-item {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.88rem;
    }

    .session-item-label {
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.78rem;
      display: block;
      margin-bottom: 2px;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    @media print {
      body {
        background-color: #fff;
        color: #000;
        padding: 0;
      }
      .container {
        border: none;
        box-shadow: none;
        max-width: 100%;
        padding: 0;
      }
      .form-group, .form-row, .submit-btn, .footer, .btn-print, .header p {
        display: none !important;
      }
      .report-card {
        display: block !important;
      }
      .report-section {
        background-color: #fff !important;
        border: 1px solid #ccc !important;
        color: #000 !important;
        break-inside: avoid;
      }
      .section-body, .session-item {
        color: #000 !important;
        background-color: #f9f9f9 !important;
        border-color: #ddd !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Mr. Harony | Weekly Reports</h2>
      <p>Cambridge IGCSE Physics</p>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Username / Email" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      </div>
    </div>

    <div class="form-group">
      <label>Select Week</label>
      <select id="weekSelect">
        <option value="Week 5" selected>Week 5</option>
        <option value="Week 4">Week 4</option>
        <option value="Week 3">Week 3</option>
        <option value="Week 2">Week 2</option>
        <option value="Week 1">Week 1</option>
      </select>
    </div>

    <button type="button" class="submit-btn" id="fetchBtn">View Report</button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="report-card" id="reportCard">
      <div class="report-top-bar">
        <h3 id="reportTitle">Weekly Report</h3>
        <button type="button" class="btn-print" onclick="window.print()">🖨️ Print</button>
      </div>

      <!-- 1. Student Information -->
      <div class="report-section">
        <div class="section-title">👤 Student Information</div>
        <div class="section-body" id="secStudentInfo"></div>
      </div>

      <!-- 2. Saturday Exam -->
      <div class="report-section">
        <div class="section-title">📝 Saturday Exam</div>
        <div class="section-body" id="secSaturdayExam"></div>
      </div>

      <!-- 3. Monday Exam -->
      <div class="report-section">
        <div class="section-title">📝 Monday Exam</div>
        <div class="section-body" id="secMondayExam"></div>
      </div>

      <!-- 4. Friday Homework -->
      <div class="report-section">
        <div class="section-title">📚 Friday Homework</div>
        <div class="section-body" id="secFridayHw"></div>
      </div>

      <!-- 5. Attendance & Participation (3 Sessions) -->
      <div class="report-section">
        <div class="section-title">📅 Attendance & Participation</div>
        <div class="sessions-grid">
          <div class="session-item">
            <span class="session-item-label">SESSION 1</span>
            <div id="secSession1">-</div>
          </div>
          <div class="session-item">
            <span class="session-item-label">SESSION 2</span>
            <div id="secSession2">-</div>
          </div>
          <div class="session-item">
            <span class="session-item-label">SESSION 3</span>
            <div id="secSession3">-</div>
          </div>
        </div>
      </div>

    </div>

    <div class="footer">Cambridge IGCSE Physics • Mr. Harony</div>
  </div>

  <script>
    const WEBHOOK_URL = "https://n8n.sciencetoonz.com/webhook/student-report";

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('harony_parent_user');
      const savedPass = localStorage.getItem('harony_parent_pass');
      if (savedUser) document.getElementById('username').value = savedUser;
      if (savedPass) document.getElementById('password').value = savedPass;
    });

    function formatMarkdown(text) {
      if (!text) return 'N/A';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/\*(.*?)\*/g, '<b>$1</b>');
    }

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const btn = document.getElementById('fetchBtn');
      const errorMsg = document.getElementById('errorMsg');
      const reportCard = document.getElementById('reportCard');
      const reportTitle = document.getElementById('reportTitle');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const selectedWeek = document.getElementById('weekSelect').value;

      errorMsg.style.display = 'none';
      reportCard.style.display = 'none';

      if (!username || !password) {
        errorMsg.textContent = "Please enter your username and password.";
        errorMsg.style.display = 'block';
        return;
      }

      localStorage.setItem('harony_parent_user', username);
      localStorage.setItem('harony_parent_pass', password);

      btn.disabled = true;
      btn.textContent = "Loading Report...";

      const payload = {
        username: username,
        password: password,
        week: selectedWeek
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          reportTitle.textContent = `${selectedWeek} Report`;

          // 1. Student Information
          let infoText = "";
          if (typeof data.student_info === 'object' && data.student_info !== null) {
            infoText = `**Name:** ${data.student_info.name || ''}`;
            if (data.student_info.group) infoText += `  |  **Group:** ${data.student_info.group}`;
          } else {
            infoText = data.student_info || data.student_name || '';
          }
          document.getElementById('secStudentInfo').innerHTML = formatMarkdown(infoText);

          // 2. Saturday Exam
          document.getElementById('secSaturdayExam').innerHTML = formatMarkdown(data.saturday_exam);

          // 3. Monday Exam
          document.getElementById('secMondayExam').innerHTML = formatMarkdown(data.monday_exam);

          // 4. Friday Homework
          document.getElementById('secFridayHw').innerHTML = formatMarkdown(data.friday_homework);

          // 5. Attendance & Participation (3 Sessions)
          if (data.attendance && typeof data.attendance === 'object') {
            document.getElementById('secSession1').innerHTML = formatMarkdown(data.attendance.session_1);
            document.getElementById('secSession2').innerHTML = formatMarkdown(data.attendance.session_2);
            document.getElementById('secSession3').innerHTML = formatMarkdown(data.attendance.session_3);
          } else {
            document.getElementById('secSession1').innerHTML = formatMarkdown(data.attendance_session_1 || data.attendance);
            document.getElementById('secSession2').innerHTML = formatMarkdown(data.attendance_session_2 || '-');
            document.getElementById('secSession3').innerHTML = formatMarkdown(data.attendance_session_3 || '-');
          }

          reportCard.style.display = 'block';
        } else {
          errorMsg.textContent = data.message || "Invalid credentials or no report found for this week.";
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = "Unable to connect to the server. Please try again later.";
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = "View Report";
      }
    });
  </script>
</body>
</html>
