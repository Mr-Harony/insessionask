<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Progress Report - Mr. Harony</title>
  <style>
    :root {
      --bg-color: #1e2230;
      --card-bg: #282c3f;
      --input-bg: #1e2230;
      --border-color: #3f445e;
      --text-main: #f0f2f5;
      --text-muted: #8c93b0;
      --primary: #4f6ef7;
      --primary-hover: #3d5be0;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 580px;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 11px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    select {
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      font-size: 0.9rem;
      text-align: center;
    }

    .report-card {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      line-height: 1.6;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .report-header h3 {
      font-size: 1.15rem;
      color: var(--primary);
    }

    .btn-print {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-print:hover {
      color: var(--text-main);
      border-color: var(--primary);
    }

    .report-content {
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .report-content b {
      color: #fff;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media print {
      body {
        background-color: #fff;
        color: #000;
        padding: 0;
      }
      .container {
        border: none;
        box-shadow: none;
        max-width: 100%;
        padding: 0;
      }
      .form-group, .submit-btn, .footer, .btn-print, .header p {
        display: none !important;
      }
      .report-card {
        display: block !important;
        border: none;
        background-color: #fff;
        color: #000;
        padding: 0;
      }
      .report-header h3 {
        color: #000;
      }
      .report-content b {
        color: #000;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Student Progress Portal 📊</h2>
      <p>Physics with Mr. Harony</p>
    </div>

    <div class="form-group">
      <label>Username / Email</label>
      <input type="text" id="username" placeholder="Enter username or email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <div class="form-group">
      <label>Select Week</label>
      <select id="weekSelect">
        <option value="Week 5" selected>Week 5</option>
        <option value="Week 4">Week 4</option>
        <option value="Week 3">Week 3</option>
        <option value="Week 2">Week 2</option>
        <option value="Week 1">Week 1</option>
      </select>
    </div>

    <button type="button" class="submit-btn" id="fetchBtn">View Report</button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="report-card" id="reportCard">
      <div class="report-header">
        <h3 id="reportTitle">Student Report</h3>
        <button type="button" class="btn-print" onclick="window.print()">🖨️ Print</button>
      </div>
      <div class="report-content" id="reportContent"></div>
    </div>

    <div class="footer">Cambridge IGCSE Physics • Mr. Harony</div>
  </div>

  <script>
    const WEBHOOK_URL = "https://n8n.sciencetoonz.com/webhook/student-report";

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('harony_parent_user');
      const savedPass = localStorage.getItem('harony_parent_pass');
      if (savedUser) document.getElementById('username').value = savedUser;
      if (savedPass) document.getElementById('password').value = savedPass;
    });

    function formatMarkdown(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/\*(.*?)\*/g, '<b>$1</b>');
    }

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const btn = document.getElementById('fetchBtn');
      const errorMsg = document.getElementById('errorMsg');
      const reportCard = document.getElementById('reportCard');
      const reportContent = document.getElementById('reportContent');
      const reportTitle = document.getElementById('reportTitle');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const selectedWeek = document.getElementById('weekSelect').value;

      errorMsg.style.display = 'none';
      reportCard.style.display = 'none';

      if (!username || !password) {
        errorMsg.textContent = "Please enter your username and password.";
        errorMsg.style.display = 'block';
        return;
      }

      localStorage.setItem('harony_parent_user', username);
      localStorage.setItem('harony_parent_pass', password);

      btn.disabled = true;
      btn.textContent = "Loading Report...";

      const payload = {
        username: username,
        password: password,
        week: selectedWeek
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          reportTitle.textContent = `Progress Report: ${data.student_name || ''} - ${selectedWeek}`;
          reportContent.innerHTML = formatMarkdown(data.report_text);
          reportCard.style.display = 'block';
        } else {
          errorMsg.textContent = data.message || "Invalid credentials or no report found for this week.";
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = "Unable to connect to the server. Please try again later.";
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = "View Report";
      }
    });
  </script>
</body>
</html>
