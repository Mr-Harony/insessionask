<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقرير متابعة الطالب - Mr. Harony</title>
  <style>
    :root {
      --bg-color: #1e2230;
      --card-bg: #282c3f;
      --input-bg: #1e2230;
      --border-color: #3f445e;
      --text-main: #f0f2f5;
      --text-muted: #8c93b0;
      --primary: #4f6ef7;
      --primary-hover: #3d5be0;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Tahoma, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 580px;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 11px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    select {
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      font-size: 0.9rem;
      text-align: center;
    }

    .report-card {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      line-height: 1.6;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
