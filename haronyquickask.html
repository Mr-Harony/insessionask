<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mr Harony Quick Ask</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
:root {
  --bg: #f5f7ff;
  --card: #ffffff;
  --text: #111;
  --muted: #666;
  --primary: #4f6df5;
  --answer-bg: #f4f6ff;
  --border: #1a2b4c;
}

body.dark {
  --bg: #0f1220;
  --card: #2b2e38;
  --text: #f1f1f1;
  --muted: #aaa;
  --primary: #6a82ff;
  --answer-bg: #1f2550;
  --border: #ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 16px 12px;
  background: radial-gradient(circle at top, var(--bg), #e6ebf5);
  font-family: "Segoe UI", Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

.card {
  width: min(550px, 100%);
  padding: 22px 18px;
  background: var(--card);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 15px 35px rgba(0,0,0,0.12);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.header h1 {
  margin: 0;
  font-size: 20px;
}

.toggle {
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  color: var(--primary);
  user-select: none;
}

.form-row {
  display: flex;
  gap: 10px;
}

.form-group {
  flex: 1;
}

label {
  font-weight: bold;
  margin-top: 14px;
  display: block;
  font-size: 13px;
}

input[type="text"], input[type="password"], textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font-size: 14px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

/* Paste & Camera Container */
.upload-zone {
  margin-top: 8px;
  border: 2px dashed var(--primary);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  background: rgba(79, 109, 245, 0.04);
}

.paste-box {
  outline: none;
  font-size: 13px;
  color: var(--muted);
  cursor: text;
  padding: 8px;
}

.camera-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
  padding: 10px 16px;
  background: var(--primary);
  color: #fff;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  border: none;
}

#cameraInput {
  display: none;
}

/* Slots Preview */
.slots-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.slot-item {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px;
  text-align: center;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.02);
}

.slot-item img {
  width: 100%;
  height: 70px;
  object-fit: cover;
  border-radius: 6px;
  display: none;
}

.slot-placeholder {
  font-size: 11px;
  color: var(--muted);
}

.remove-tag {
  color: #d9534f;
  font-size: 11px;
  font-weight: bold;
  margin-top: 4px;
  cursor: pointer;
  display: none;
}

/* Submit */
button#sendBtn {
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: linear-gradient(135deg, #4f6df5, #6a82ff);
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button#sendBtn.loading {
  background: linear-gradient(135deg, #9aa0b8, #7d839c);
  cursor: not-allowed;
}

#answer {
  background: var(--answer-bg);
  padding: 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  line-height: 1.6;
  white-space: pre-wrap;
  margin-top: 16px;
  display: none;
  font-size: 14px;
}

.footer {
  margin-top: 16px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h1>Mr Harony Quick Ask</h1>
    <div class="toggle" onclick="toggleTheme()">🌙 Dark / Light</div>
  </div>

  <!-- Credentials -->
  <div class="form-row">
    <div class="form-group">
      <label>Username</label>
      <input id="username" type="text" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
  </div>

  <!-- Add Image Zone (Paste + Camera) -->
  <label>Attach Images (Up to 3 photos)</label>
  <div class="upload-zone" id="uploadZone">
    <div class="paste-box" tabindex="0" id="pasteBox">
      📋 <strong>Paste image here</strong> (Tap & Paste or Ctrl+V)
    </div>
    
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <label for="cameraInput" class="camera-btn">📷 Open Camera</label>
  </div>

  <!-- 3 Slots Indicators -->
  <div class="slots-container">
    <div class="slot-item" id="slot1">
      <span class="slot-placeholder" id="ph1">Slot 1 (Empty)</span>
      <img id="thumb1">
      <span class="remove-tag" id="rm1" onclick="removeSlot(1)">✖ Remove</span>
    </div>
    <div class="slot-item" id="slot2">
      <span class="slot-placeholder" id="ph2">Slot 2 (Empty)</span>
      <img id="thumb2">
      <span class="remove-tag" id="rm2" onclick="removeSlot(2)">✖ Remove</span>
    </div>
    <div class="slot-item" id="slot3">
      <span class="slot-placeholder" id="ph3">Slot 3 (Empty)</span>
      <img id="thumb3">
      <span class="remove-tag" id="rm3" onclick="removeSlot(3)">✖ Remove</span>
    </div>
  </div>

  <!-- Question -->
  <label>What is your question?</label>
  <textarea id="question" placeholder="Type your question or notes here..."></textarea>

  <button id="sendBtn"><span>Ask Mr. Harony</span></button>

  <div id="answer"></div>

  <div class="footer">
    Secure academic assistant • Mr. Harony
  </div>
</div>

<script>
const WEBHOOK_URL = "https://n8n.sciencetoonz.com/webhook/wabotqanda";

const usernameEl = document.getElementById("username");
const passwordEl = document.getElementById("password");
const questionEl = document.getElementById("question");
const answerEl   = document.getElementById("answer");
const sendBtn    = document.getElementById("sendBtn");
const cameraInput = document.getElementById("cameraInput");
const pasteBox   = document.getElementById("pasteBox");

let imagesData = {
  image_1: null,
  image_2: null,
  image_3: null
};

usernameEl.value = localStorage.getItem("student_username") || "";
passwordEl.value = localStorage.getItem("student_password") || "";

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}

function toggleTheme() {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

// دالة ضغط الصور لتوفير الحجم
function compressImage(file, maxDimension = 1280, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxDimension) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          }
        } else {
          if (height > maxDimension) {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

// إيجاد الخانة الفارغة التالية وحفظ الصورة فيها
async function handleNewImage(file) {
  let targetSlot = null;
  for (let i = 1; i <= 3; i++) {
    if (!imagesData[`image_${i}`]) {
      targetSlot = i;
      break;
    }
  }

  if (!targetSlot) {
    alert("You have already added 3 images. Remove one to add another.");
    return;
  }

  try {
    const compressed = await compressImage(file);
    imagesData[`image_${targetSlot}`] = compressed;

    document.getElementById(`ph${targetSlot}`).style.display = "none";
    const thumb = document.getElementById(`thumb${targetSlot}`);
    thumb.src = compressed;
    thumb.style.display = "block";
    document.getElementById(`rm${targetSlot}`).style.display = "block";
  } catch (err) {
    alert("Error processing image.");
  }
}

// 1. التقاط الصور عبر الكاميرا
cameraInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (file) {
    handleNewImage(file);
    cameraInput.value = "";
  }
});

// 2. استقبال الصور عبر Copy / Paste (على الموبايل أو الكمبيوتر)
window.addEventListener("paste", (e) => {
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (let index in items) {
    const item = items[index];
    if (item.kind === "file" && item.type.includes("image/")) {
      const blob = item.getAsFile();
      handleNewImage(blob);
    }
  }
});

function removeSlot(idx) {
  imagesData[`image_${idx}`] = null;
  document.getElementById(`thumb${idx}`).style.display = "none";
  document.getElementById(`thumb${idx}`).src = "";
  document.getElementById(`rm${idx}`).style.display = "none";
  document.getElementById(`ph${idx}`).style.display = "block";
}

// إرسال البيانات
sendBtn.addEventListener("click", async () => {
  if (sendBtn.disabled) return;

  const u = usernameEl.value.trim();
  const p = passwordEl.value.trim();
  const q = questionEl.value.trim();

  if (!u || !p) {
    answerEl.style.display = "block";
    answerEl.innerText = "❌ Please provide Username and Password.";
    return;
  }

  if (!q && !imagesData.image_1 && !imagesData.image_2 && !imagesData.image_3) {
    answerEl.style.display = "block";
    answerEl.innerText = "❌ Please enter a question or attach at least one photo.";
    return;
  }

  localStorage.setItem("student_username", u);
  localStorage.setItem("student_password", p);

  sendBtn.disabled = true;
  sendBtn.classList.add("loading");
  sendBtn.innerHTML = "<span>Waiting for Mr. Harony reply...</span>";
  answerEl.style.display = "block";
  answerEl.innerText = "⏳ Thinking...";

  const payload = {
    username: u,
    password: p,
    question: q || "",
    image_1: imagesData.image_1,
    image_2: imagesData.image_2,
    image_3: imagesData.image_3
  };

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const text = await res.text();
    const formatted = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    answerEl.innerHTML = formatted || "⚠️ Empty response";

  } catch {
    answerEl.innerText = "❌ Connection error. Please try again.";
  } finally {
    sendBtn.disabled = false;
    sendBtn.classList.remove("loading");
    sendBtn.innerHTML = "<span>Ask Mr. Harony</span>";
  }
});
</script>

</body>
</html>
