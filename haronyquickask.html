<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr Harony Quick Ask</title>
  <style>
    :root {
      --bg-color: #1e2230;
      --card-bg: #282c3f;
      --input-bg: #1e2230;
      --border-color: #3f445e;
      --text-main: #f0f2f5;
      --text-muted: #8c93b0;
      --primary: #4f6ef7;
      --primary-hover: #3d5be0;
      --btn-file: #3d7bf7;
      --danger: #ef4444;
      --box-empty: #232738;
    }

    body.light-theme {
      --bg-color: #f0f2f8;
      --card-bg: #ffffff;
      --input-bg: #f8fafc;
      --border-color: #d1d5db;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --btn-file: #2563eb;
      --danger: #dc2626;
      --box-empty: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 580px;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h2 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .theme-toggle {
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--primary);
      user-select: none;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    /* Slots Styling */
    .slots-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .slot-card {
      background-color: var(--box-empty);
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      position: relative;
      text-align: center;
    }

    .slot-card.has-image {
      border-style: solid;
      border-color: var(--border-color);
      background-color: var(--input-bg);
    }

    .slot-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .slot-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .slot-btn {
      width: 100%;
      padding: 5px 0;
      font-size: 0.75rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 500;
    }

    .btn-file {
      background-color: var(--btn-file);
      color: #fff;
    }

    .btn-paste {
      background-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-paste:hover {
      background-color: #4b5270;
    }

    .preview-box {
      width: 100%;
      height: 95px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 75px;
      border-radius: 6px;
      object-fit: contain;
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.75rem;
      cursor: pointer;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Output Box */
    .response-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Mr Harony Quick Ask</h2>
      <span class="theme-toggle" id="themeBtn">🌙 Dark / Light</span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Try@try.com" value="Try@try.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" value="Abcd@1234">
      </div>
    </div>

    <label>Attach Images (Up to 3 photos)</label>
    <div class="slots-container">
      
      <!-- Slot 1 -->
      <div class="slot-card" id="slot-card-1">
        <span class="slot-title">Photo 1</span>
        <div class="slot-actions" id="actions-1">
          <input type="file" id="file-1" accept="image/*" style="display:none;">
          <button type="button" class="slot-btn btn-file" onclick="document.getElementById('file-1').click()">📁 Camera / File</button>
          <button type="button" class="slot-btn btn-paste" onclick="pasteToSlot(1)">📋 Paste</button>
        </div>
        <div class="preview-box" id="preview-1">
          <img id="img-1" src="" alt="Photo 1">
          <button type="button" class="btn-remove" onclick="removeSlot(1)">✖ Remove</button>
        </div>
      </div>

      <!-- Slot 2 -->
      <div class="slot-card" id="slot-card-2">
        <span class="slot-title">Photo 2</span>
        <div class="slot-actions" id="actions-2">
          <input type="file" id="file-2" accept="image/*" style="display:none;">
          <button type="button" class="slot-btn btn-file" onclick="document.getElementById('file-2').click()">📁 Camera / File</button>
          <button type="button" class="slot-btn btn-paste" onclick="pasteToSlot(2)">📋 Paste</button>
        </div>
        <div class="preview-box" id="preview-2">
          <img id="img-2" src="" alt="Photo 2">
          <button type="button" class="btn-remove" onclick="removeSlot(2)">✖ Remove</button>
        </div>
      </div>

      <!-- Slot 3 -->
      <div class="slot-card" id="slot-card-3">
        <span class="slot-title">Photo 3</span>
        <div class="slot-actions" id="actions-3">
          <input type="file" id="file-3" accept="image/*" style="display:none;">
          <button type="button" class="slot-btn btn-file" onclick="document.getElementById('file-3').click()">📁 Camera / File</button>
          <button type="button" class="slot-btn btn-paste" onclick="pasteToSlot(3)">📋 Paste</button>
        </div>
        <div class="preview-box" id="preview-3">
          <img id="img-3" src="" alt="Photo 3">
          <button type="button" class="btn-remove" onclick="removeSlot(3)">✖ Remove</button>
        </div>
      </div>

    </div>

    <div class="form-group">
      <label>What is your question?</label>
      <textarea id="question" placeholder="Write your question here..."></textarea>
    </div>

    <button type="button" class="submit-btn" id="submitBtn">Ask Mr. Harony</button>

    <div class="response-box" id="responseBox"></div>

    <div class="footer">Secure academic assistant • Mr. Harony</div>
  </div>

  <script>
    // ضع رابط الـ Webhook الخاص بك هنا
    const WEBHOOK_URL = "https://n8n.sciencetoonz.com/webhook/haronyquickask";

    const images = { 1: null, 2: null, 3: null };

    // Theme toggle
    document.getElementById('themeBtn').addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
    });

    // Setup file inputs
    [1, 2, 3].forEach(slot => {
      document.getElementById(`file-${slot}`).addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
          compressAndSaveImage(e.target.files[0], slot);
        }
      });
    });

    // Paste function for each specific slot
    async function pasteToSlot(slot) {
      try {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          const imageType = item.types.find(type => type.startsWith('image/'));
          if (imageType) {
            const blob = await item.getType(imageType);
            compressAndSaveImage(blob, slot);
            return;
          }
        }
        alert("No image found in clipboard!");
      } catch (err) {
        alert("Clipboard permission denied or not supported. Use Camera / File button instead.");
      }
    }

    // Compress & set preview
    function compressAndSaveImage(file, slot) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 1200;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // تصغير الجودة لضمان سرعة نقل الـ Base64
          const base64 = canvas.toDataURL('image/jpeg', 0.7);
          images[slot] = base64;

          // Update UI
          document.getElementById(`img-${slot}`).src = base64;
          document.getElementById(`actions-${slot}`).style.display = 'none';
          document.getElementById(`preview-${slot}`).style.display = 'flex';
          document.getElementById(`slot-card-${slot}`).classList.add('has-image');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Remove slot image
    function removeSlot(slot) {
      images[slot] = null;
      document.getElementById(`file-${slot}`).value = '';
      document.getElementById(`img-${slot}`).src = '';
      document.getElementById(`actions-${slot}`).style.display = 'flex';
      document.getElementById(`preview-${slot}`).style.display = 'none';
      document.getElementById(`slot-card-${slot}`).classList.remove('has-image');
    }

    // Submit handler
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const btn = document.getElementById('submitBtn');
      const box = document.getElementById('responseBox');
      const question = document.getElementById('question').value.trim();

      if (!question && !images[1] && !images[2] && !images[3]) {
        alert("Please enter a question or upload at least one image.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Analyzing & Solving...";
      box.style.display = "block";
      box.textContent = "Connecting to Mr. Harony's assistant...";

      const payload = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        question: question,
        image_1: images[1],
        image_2: images[2],
        image_3: images[3]
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const textResponse = await response.text();
        box.textContent = textResponse;
      } catch (err) {
        box.textContent = "Error: Could not reach the server. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Ask Mr. Harony";
      }
    });
  </script>
</body>
</html>
