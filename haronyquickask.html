<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr Harony Quick Ask</title>
  <style>
    :root {
      --bg-color: #1e2230;
      --card-bg: #282c3f;
      --input-bg: #1e2230;
      --border-color: #3f445e;
      --text-main: #f0f2f5;
      --text-muted: #8c93b0;
      --primary: #4f6ef7;
      --primary-hover: #3d5be0;
      --danger: #ef4444;
      --box-empty: #232738;
      --slot-focus: #4f6ef7;
    }

    body.light-theme {
      --bg-color: #f0f2f8;
      --card-bg: #ffffff;
      --input-bg: #f8fafc;
      --border-color: #d1d5db;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #dc2626;
      --box-empty: #f1f5f9;
      --slot-focus: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 580px;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h2 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .theme-toggle {
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--primary);
      user-select: none;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    /* Slots Styling */
    .slots-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .slot-card {
      background-color: var(--box-empty);
      border: 2px dashed var(--border-color);
      border-radius: 10px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 145px;
      position: relative;
      text-align: center;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .slot-card:focus {
      border-color: var(--slot-focus);
      background-color: rgba(79, 110, 247, 0.08);
      box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.2);
    }

    .slot-card.drag-over {
      border-color: var(--primary);
      background-color: rgba(79, 110, 247, 0.15);
    }

    .slot-card.has-image {
      border-style: solid;
      border-color: var(--border-color);
      background-color: var(--input-bg);
      cursor: default;
    }

    .slot-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .slot-instructions {
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.3;
      pointer-events: none;
    }

    .slot-instructions b {
      color: var(--primary);
    }

    .preview-box {
      width: 100%;
      height: 110px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 85px;
      border-radius: 6px;
      object-fit: contain;
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.75rem;
      cursor: pointer;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Custom Right-Click Context Menu */
    .custom-menu {
      display: none;
      position: fixed;
      z-index: 1000;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
      padding: 5px;
      min-width: 140px;
    }

    .custom-menu-item {
      padding: 8px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 6px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .custom-menu-item:hover {
      background-color: var(--primary);
      color: #fff;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Output Box */
    .response-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      display: none;
      word-break: break-word;
    }

    .response-box b, .response-box strong {
      font-weight: 700;
      color: var(--text-main);
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Mr Harony Quick Ask</h2>
      <span class="theme-toggle" id="themeBtn">🌙 Dark / Light</span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Try@try.com" value="Try@try.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" value="Abcd@1234">
      </div>
    </div>

    <label>Snap Photo with Camera or Paste (Ctrl+V)</label>
    <div class="slots-container">
      
      <!-- Slot 1 -->
      <div class="slot-card" id="slot-card-1" tabindex="0" data-slot="1">
        <span class="slot-title">Photo 1</span>
        <div class="slot-instructions" id="info-1">
          📷 <b>Take Photo</b><br>or <b>Ctrl+V</b> to Paste
        </div>
        <input type="file" id="file-1" accept="image/*" capture="environment" style="display:none;">
        <div class="preview-box" id="preview-1">
          <img id="img-1" src="" alt="Photo 1">
          <button type="button" class="btn-remove" onclick="removeSlot(1, event)">✖ Remove</button>
        </div>
      </div>

      <!-- Slot 2 -->
      <div class="slot-card" id="slot-card-2" tabindex="0" data-slot="2">
        <span class="slot-title">Photo 2</span>
        <div class="slot-instructions" id="info-2">
          📷 <b>Take Photo</b><br>or <b>Ctrl+V</b> to Paste
        </div>
        <input type="file" id="file-2" accept="image/*" capture="environment" style="display:none;">
        <div class="preview-box" id="preview-2">
          <img id="img-2" src="" alt="Photo 2">
          <button type="button" class="btn-remove" onclick="removeSlot(2, event)">✖ Remove</button>
        </div>
      </div>

      <!-- Slot 3 -->
      <div class="slot-card" id="slot-card-3" tabindex="0" data-slot="3">
        <span class="slot-title">Photo 3</span>
        <div class="slot-instructions" id="info-3">
          📷 <b>Take Photo</b><br>or <b>Ctrl+V</b> to Paste
        </div>
        <input type="file" id="file-3" accept="image/*" capture="environment" style="display:none;">
        <div class="preview-box" id="preview-3">
          <img id="img-3" src="" alt="Photo 3">
          <button type="button" class="btn-remove" onclick="removeSlot(3, event)">✖ Remove</button>
        </div>
      </div>

    </div>

    <div class="form-group">
      <label>What is your question?</label>
      <textarea id="question" placeholder="Write your question here..."></textarea>
    </div>

    <button type="button" class="submit-btn" id="submitBtn">Ask Mr. Harony</button>

    <div class="response-box" id="responseBox"></div>

    <div class="footer">Secure academic assistant • Mr. Harony</div>
  </div>

  <!-- Custom Context Menu for Right-Click -->
  <div class="custom-menu" id="customMenu">
    <div class="custom-menu-item" id="menuPaste">📋 Paste Image</div>
    <div class="custom-menu-item" id="menuCamera">📷 Take Photo</div>
  </div>

  <script>
    const WEBHOOK_URL = "https://n8n.sciencetoonz.com/webhook/haronyquickask";
    const images = { 1: null, 2: null, 3: null };
    let activeMenuSlot = null;

    // Theme toggle
    document.getElementById('themeBtn').addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
    });

    // Format response to bold
    function formatMarkdown(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/\*(.*?)\*/g, '<b>$1</b>');
    }

    // Setup Slots interactions
    [1, 2, 3].forEach(slot => {
      const card = document.getElementById(`slot-card-${slot}`);
      const fileInput = document.getElementById(`file-${slot}`);

      // Click opens camera directly (if no image present)
      card.addEventListener('click', (e) => {
        if (!images[slot] && !e.target.classList.contains('btn-remove')) {
          fileInput.click();
        }
      });

      // Camera capture change
      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          compressAndSaveImage(e.target.files[0], slot);
        }
      });

      // Direct Paste via Ctrl+V when card is focused
      card.addEventListener('paste', (e) => {
        e.preventDefault();
        e.stopPropagation();
        handlePasteData(e.clipboardData, slot);
      });

      // Right-Click Context Menu
      card.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        activeMenuSlot = slot;
        const menu = document.getElementById('customMenu');
        menu.style.display = 'block';
        menu.style.left = `${e.clientX}px`;
        menu.style.top = `${e.clientY}px`;
      });
    });

    // Close context menu on outside click
    window.addEventListener('click', () => {
      document.getElementById('customMenu').style.display = 'none';
    });

    // Context Menu: Paste click
    document.getElementById('menuPaste').addEventListener('click', async () => {
      if (!activeMenuSlot) return;
      try {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          const imageType = item.types.find(type => type.startsWith('image/'));
          if (imageType) {
            const blob = await item.getType(imageType);
            compressAndSaveImage(blob, activeMenuSlot);
            return;
          }
        }
        alert("No image found in clipboard!");
      } catch (err) {
        alert("Clipboard access denied. Please click the slot and press Ctrl+V directly.");
      }
    });

    // Context Menu: Camera click
    document.getElementById('menuCamera').addEventListener('click', () => {
      if (activeMenuSlot) {
        document.getElementById(`file-${activeMenuSlot}`).click();
      }
    });

    // Process Paste Data
    function handlePasteData(clipboardData, slot) {
      if (!clipboardData || !clipboardData.items) return;
      for (let i = 0; i < clipboardData.items.length; i++) {
        if (clipboardData.items[i].type.indexOf('image') !== -1) {
          const blob = clipboardData.items[i].getAsFile();
          compressAndSaveImage(blob, slot);
          return;
        }
      }
      alert("No image found in clipboard!");
    }

    // Global Paste Fallback: pastes to first empty slot if outside textarea
    window.addEventListener('paste', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      const targetSlot = [1, 2, 3].find(s => !images[s]);
      if (targetSlot) {
        handlePasteData(e.clipboardData, targetSlot);
      }
    });

    // Compress & Preview
    function compressAndSaveImage(file, slot) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 1920;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const base64 = canvas.toDataURL('image/jpeg', 0.8);
          images[slot] = base64;

          document.getElementById(`img-${slot}`).src = base64;
          document.getElementById(`info-${slot}`).style.display = 'none';
          document.getElementById(`preview-${slot}`).style.display = 'flex';
          document.getElementById(`slot-card-${slot}`).classList.add('has-image');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Remove slot image
    function removeSlot(slot, event) {
      if (event) event.stopPropagation();
      images[slot] = null;
      document.getElementById(`file-${slot}`).value = '';
      document.getElementById(`img-${slot}`).src = '';
      document.getElementById(`info-${slot}`).style.display = 'block';
      document.getElementById(`preview-${slot}`).style.display = 'none';
      document.getElementById(`slot-card-${slot}`).classList.remove('has-image');
    }

    // Submit handler
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const btn = document.getElementById('submitBtn');
      const box = document.getElementById('responseBox');
      const question = document.getElementById('question').value.trim();

      if (!question && !images[1] && !images[2] && !images[3]) {
        alert("Please enter a question or capture at least one photo.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Analyzing & Solving...";
      box.style.display = "block";
      box.textContent = "Connecting to Mr. Harony's assistant...";

      const payload = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        question: question,
        image_1: images[1],
        image_2: images[2],
        image_3: images[3]
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const textResponse = await response.text();
        box.innerHTML = formatMarkdown(textResponse);
      } catch (err) {
        box.textContent = "Error: Could not reach the server. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Ask Mr. Harony";
      }
    });
  </script>
</body>
</html>
