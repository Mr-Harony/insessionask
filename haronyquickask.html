<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ask Mr. Harony - Image & Question Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #f5f7ff;
  --card: #ffffff;
  --text: #111;
  --muted: #666;
  --primary: #4f6df5;
  --answer-bg: #f4f6ff;
  --border: #1a2b4c;
}

body.dark {
  --bg: #0f1220;
  --card: #2b2e38;
  --text: #f1f1f1;
  --muted: #aaa;
  --primary: #6a82ff;
  --answer-bg: #1f2550;
  --border: #ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 16px;
  background: radial-gradient(circle at top, var(--bg), #e6ebf5);
  font-family: "Segoe UI", Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

.card {
  width: min(650px, 100%);
  padding: 30px;
  background: var(--card);
  border-radius: 18px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 45px rgba(0,0,0,0.12);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.toggle {
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  color: var(--primary);
}

.form-row {
  display: flex;
  gap: 16px;
}

.form-group {
  flex: 1;
}

label {
  font-weight: bold;
  margin-top: 14px;
  display: block;
  font-size: 14px;
}

input[type="text"], input[type="password"], textarea {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font-size: 15px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

/* Image Upload Slots */
.image-slots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-top: 8px;
}

.slot-box {
  border: 1px dashed var(--border);
  border-radius: 10px;
  padding: 12px;
  text-align: center;
  background: rgba(79, 109, 245, 0.03);
}

.slot-box input[type="file"] {
  display: none;
}

.upload-btn {
  display: inline-block;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: bold;
  color: var(--primary);
  border: 1px solid var(--primary);
  border-radius: 6px;
  cursor: pointer;
  margin-top: 6px;
}

.preview-thumb {
  width: 100%;
  height: 90px;
  object-fit: cover;
  border-radius: 6px;
  margin-top: 8px;
  display: none;
  border: 1px solid var(--border);
}

.remove-btn {
  display: none;
  font-size: 11px;
  color: #d9534f;
  cursor: pointer;
  margin-top: 4px;
  font-weight: bold;
}

/* Submit Button */
button#sendBtn {
  position: relative;
  overflow: hidden;
  margin-top: 24px;
  margin-bottom: 20px;
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: linear-gradient(135deg, #4f6df5, #6a82ff);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button#sendBtn.loading {
  background: linear-gradient(135deg, #9aa0b8, #7d839c);
  cursor: not-allowed;
}

#answer {
  background: var(--answer-bg);
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  line-height: 1.7;
  white-space: pre-wrap;
  display: none;
}

.footer {
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h1>Ask Mr. Harony</h1>
    <div class="toggle" onclick="toggleTheme()">🌙 Dark / Light</div>
  </div>

  <!-- Credentials -->
  <div class="form-row">
    <div class="form-group">
      <label>Username</label>
      <input id="username" type="text">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password">
    </div>
  </div>

  <!-- 3 Image Slots -->
  <label>Attach Images (Optional)</label>
  <div class="image-slots-grid">
    <!-- Slot 1 -->
    <div class="slot-box">
      <div style="font-size: 13px; font-weight: bold;">Image 1</div>
      <label for="imgInput1" class="upload-btn">📷 Add Image 1</label>
      <input type="file" id="imgInput1" accept="image/*" capture="environment">
      <img id="thumb1" class="preview-thumb">
      <div id="remove1" class="remove-btn" onclick="clearSlot(1)">✖ Remove</div>
    </div>

    <!-- Slot 2 -->
    <div class="slot-box">
      <div style="font-size: 13px; font-weight: bold;">Image 2</div>
      <label for="imgInput2" class="upload-btn">📷 Add Image 2</label>
      <input type="file" id="imgInput2" accept="image/*" capture="environment">
      <img id="thumb2" class="preview-thumb">
      <div id="remove2" class="remove-btn" onclick="clearSlot(2)">✖ Remove</div>
    </div>

    <!-- Slot 3 -->
    <div class="slot-box">
      <div style="font-size: 13px; font-weight: bold;">Image 3</div>
      <label for="imgInput3" class="upload-btn">📷 Add Image 3</label>
      <input type="file" id="imgInput3" accept="image/*" capture="environment">
      <img id="thumb3" class="preview-thumb">
      <div id="remove3" class="remove-btn" onclick="clearSlot(3)">✖ Remove</div>
    </div>
  </div>

  <!-- Text Question -->
  <label>What is your question?</label>
  <textarea id="question" placeholder="Type your question or notes here..."></textarea>

  <button id="sendBtn"><span>Ask Mr. Harony</span></button>

  <div id="answer"></div>

  <div class="footer">
    Secure academic assistant • Mr. Harony
  </div>
</div>

<script>
// ضع هنا رابط Webhook الخاص بـ n8n
const WEBHOOK_URL = "https://n8n.sciencetoonz.com/webhook/wabotqanda";

const usernameEl = document.getElementById("username");
const passwordEl = document.getElementById("password");
const questionEl = document.getElementById("question");
const answerEl   = document.getElementById("answer");
const sendBtn    = document.getElementById("sendBtn");

// تخزين الصور المضغوطة بصيغة Base64
let imagesData = {
  image_1: null,
  image_2: null,
  image_3: null
};

/* تذكر بيانات الدخول والثيم */
usernameEl.value = localStorage.getItem("student_username") || "";
passwordEl.value = localStorage.getItem("student_password") || "";

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}

function toggleTheme() {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

/**
 * دالة ضغط الصورة أوتوماتيكياً في المتصفح:
 * - تجعل البعد الأقصى (عرض أو ارتفاع) 1280px بحد أقصى (زي واتساب)
 * - تضبط جودة الصورة عند 0.7 (70%)
 * - تحول الناتج إلى JPEG Base64 خفيف وسريع جداً
 */
function compressImage(file, maxDimension = 1280, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;

        // حساب الأبعاد الجديدة مع الحفاظ على النسبة والتناسب
        if (width > height) {
          if (width > maxDimension) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          }
        } else {
          if (height > maxDimension) {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        // تحويل الكانفاس لصورة مضغوطة JPEG
        const compressedBase64 = canvas.toDataURL("image/jpeg", quality);
        resolve(compressedBase64);
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

/* ربط رفع الصور مع الضغط الفوري */
[1, 2, 3].forEach(idx => {
  const input = document.getElementById(`imgInput${idx}`);
  const thumb = document.getElementById(`thumb${idx}`);
  const removeBtn = document.getElementById(`remove${idx}`);

  input.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (file) {
      thumb.style.display = "block";
      thumb.src = ""; // إفراغ مؤقت أثناء الضغط
      try {
        const compressedDataUrl = await compressImage(file);
        imagesData[`image_${idx}`] = compressedDataUrl;
        thumb.src = compressedDataUrl;
        removeBtn.style.display = "block";
      } catch (err) {
        alert("Error processing image. Please try again.");
      }
    }
  });
});

function clearSlot(idx) {
  imagesData[`image_${idx}`] = null;
  document.getElementById(`imgInput${idx}`).value = "";
  document.getElementById(`thumb${idx}`).style.display = "none";
  document.getElementById(`remove${idx}`).style.display = "none";
}

/* إرسال الطلب */
sendBtn.addEventListener("click", async () => {
  if (sendBtn.disabled) return;

  const u = usernameEl.value.trim();
  const p = passwordEl.value.trim();
  const q = questionEl.value.trim();

  if (!u || !p) {
    answerEl.style.display = "block";
    answerEl.innerText = "❌ Please provide Username and Password.";
    return;
  }

  if (!q && !imagesData.image_1 && !imagesData.image_2 && !imagesData.image_3) {
    answerEl.style.display = "block";
    answerEl.innerText = "❌ Please enter a question or attach at least one photo.";
    return;
  }

  localStorage.setItem("student_username", u);
  localStorage.setItem("student_password", p);

  sendBtn.disabled = true;
  sendBtn.classList.add("loading");
  sendBtn.innerHTML = "<span>Waiting for Mr. Harony reply...</span>";
  answerEl.style.display = "block";
  answerEl.innerText = "⏳ Thinking...";

  const payload = {
    username: u,
    password: p,
    question: q || "",
    image_1: imagesData.image_1,
    image_2: imagesData.image_2,
    image_3: imagesData.image_3
  };

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const text = await res.text();
    const formatted = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    answerEl.innerHTML = formatted || "⚠️ Empty response";

  } catch {
    answerEl.innerText = "❌ Connection error. Please try again.";
  } finally {
    sendBtn.disabled = false;
    sendBtn.classList.remove("loading");
    sendBtn.innerHTML = "<span>Ask Mr. Harony</span>";
  }
});
</script>

</body>
</html>
