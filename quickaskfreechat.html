<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mr Harony - Quick Ask</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #eae6df;
      color: #111b21;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* الحاوية المتجاوبة للواتساب */
    .whatsapp-container {
      background-color: #efeae2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 600px) {
      .whatsapp-container {
        max-width: 500px;
        height: 94vh;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        border: 1px solid #d1d7db;
      }
    }

    /* الشريط العلوي */
    .chat-header {
      background-color: #f0f2f5;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e9edef;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #25d366;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: bold;
    }

    .header-text h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #111b21;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 0.76rem;
      color: #667781;
    }

    .btn-account-pill {
      background-color: #ffffff;
      border: 1px solid #d1d7db;
      color: #54656f;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* بار إدخال البيانات المدمج */
    .credentials-bar {
      background-color: #ffffff;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #e9edef;
      flex-shrink: 0;
    }

    .credentials-bar input {
      background-color: #f0f2f5;
      border: 1px solid #d1d7db;
      border-radius: 8px;
      padding: 7px 10px;
      color: #111b21;
      font-size: 0.82rem;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    .credentials-bar input:focus {
      border-color: #00a884;
    }

    #userEmail {
      flex: 1.2;
    }

    /* حقل الباسوورد وزر العين */
    .password-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      width: 100%;
      padding-right: 32px;
    }

    .toggle-password-btn {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      color: #54656f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      user-select: none;
    }

    /* منطقة الرسائل الفاتحة بنمط الواتساب */
    .chat-messages {
      flex: 1;
      background-color: #efeae2;
      background-image: 
        radial-gradient(#d4cdc2 1px, transparent 1px),
        radial-gradient(#d4cdc2 1px, #efeae2 1px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-row {
      display: flex;
      width: 100%;
      margin-bottom: 4px;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.bot {
      justify-content: flex-start;
    }

    .msg-bubble {
      max-width: 84%;
      padding: 7px 10px 5px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
    }

    /* فقاعة رسالة الطالب */
    .msg-row.user .msg-bubble {
      background-color: #d9fdd3;
      color: #111b21;
      border-top-left-radius: 8px;
      border-top-right-radius: 0px;
    }

    /* فقاعة رسالة المساعد */
    .msg-row.bot .msg-bubble {
      background-color: #ffffff;
      color: #111b21;
      border-top-left-radius: 0px;
      border-top-right-radius: 8px;
    }

    .bubble-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 3px;
      margin-top: 3px;
      font-size: 0.67rem;
      color: #667781;
      direction: ltr;
    }

    .ticks {
      color: #53bdeb;
      font-size: 0.72rem;
      font-weight: bold;
    }

    /* شريط معاينة الصور المرفقة */
    .attachment-preview-bar {
      background-color: #f0f2f5;
      padding: 6px 12px;
      display: flex;
      gap: 6px;
      border-top: 1px solid #e9edef;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .attached-chip {
      background-color: #ffffff;
      border: 1px solid #d1d7db;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #111b21;
    }

    .attached-chip button {
      background: none;
      border: none;
      color: #ea0038;
      font-weight: bold;
      cursor: pointer;
    }

    /* شريط الكتابة السفلي */
    .chat-footer {
      background-color: #f0f2f5;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      border-top: 1px solid #e9edef;
    }

    .btn-attach {
      background: none;
      border: none;
      color: #54656f;
      font-size: 1.35rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .footer-input {
      flex: 1;
      background-color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      color: #111b21;
      font-size: 0.92rem;
      outline: none;
      max-height: 90px;
      resize: none;
      line-height: 1.35;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
    }

    .footer-input::placeholder {
      color: #8696a0;
    }

    .btn-send-circle {
      background-color: #00a884;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.15rem;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    .btn-send-circle:hover {
      background-color: #029070;
    }

    .btn-send-circle:disabled {
      background-color: #8696a0;
      cursor: not-allowed;
    }

    /* Scrollbar */
    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div class="whatsapp-container">
  <!-- Header -->
  <div class="chat-header">
    <div class="header-user-info">
      <div class="avatar">⚛️</div>
      <div class="header-text">
        <h2>Mr Harony Assistant</h2>
        <p>Cambridge IGCSE Physics • متصل الآن</p>
      </div>
    </div>
    <div>
      <button class="btn-account-pill" id="accountBtn" onclick="toggleCredentialsForm()" title="إعدادات الحساب">
        👤 <span id="accountLabel">حسابي</span>
      </button>
    </div>
  </div>

  <!-- Credentials -->
  <div class="credentials-bar" id="credentialsBar">
    <input type="email" id="userEmail" placeholder="البريد الإلكتروني (Username)" autocomplete="username" />
    <div class="password-wrapper">
      <input type="password" id="userPassword" placeholder="كلمة المرور (Password)" autocomplete="current-password" />
      <button type="button" class="toggle-password-btn" id="togglePasswordBtn" onclick="togglePasswordVisibility()" title="إظهار / إخفاء كلمة المرور">
        👁️
      </button>
    </div>
  </div>

  <!-- Messages Feed -->
  <div class="chat-messages" id="chatMessages">
    <div class="msg-row bot">
      <div class="msg-bubble">
        أهلاً بك يا بطل في المساعد الأكاديمي لمادة الفيزياء ⚛️
اكتب استفسارك أو مسألتك هنا وسأشرحها لك خطوة بخطوة مع تذكر محادثاتنا.
        <div class="bubble-meta">
          <span class="msg-time" id="welcomeTime"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Attachment Preview -->
  <div class="attachment-preview-bar" id="previewBar" style="display: none;"></div>

  <!-- Footer Input -->
  <div class="chat-footer">
    <label class="btn-attach" title="إرفاق صور">
      📎
      <input type="file" id="fileInput" accept="image/*" style="display: none;" multiple />
    </label>

    <textarea class="footer-input" id="questionInput" rows="1" placeholder="اكتب رسالة..."></textarea>

    <button class="btn-send-circle" id="sendBtn" onclick="sendMessage()" title="إرسال">
      ➤
    </button>
  </div>
</div>

<script>
  // ضع رابط الـ Webhook الخاص بك في n8n هنا
  const N8N_WEBHOOK_URL = "https://YOUR_N8N_DOMAIN/webhook/quick-ask";

  const chatMessages = document.getElementById("chatMessages");
  const questionInput = document.getElementById("questionInput");
  const userEmail = document.getElementById("userEmail");
  const userPassword = document.getElementById("userPassword");
  const togglePasswordBtn = document.getElementById("togglePasswordBtn");
  const credentialsBar = document.getElementById("credentialsBar");
  const accountLabel = document.getElementById("accountLabel");
  const fileInput = document.getElementById("fileInput");
  const previewBar = document.getElementById("previewBar");
  const sendBtn = document.getElementById("sendBtn");
  const welcomeTime = document.getElementById("welcomeTime");

  let attachedFiles = [];

  welcomeTime.innerText = getCurrentTimeString();

  function initUserSession() {
    const savedEmail = localStorage.getItem("quickask_email");
    const savedPass = localStorage.getItem("quickask_password");

    if (savedEmail && savedPass) {
      userEmail.value = savedEmail;
      userPassword.value = savedPass;
      accountLabel.innerText = savedEmail.split("@")[0];
      credentialsBar.style.display = "none";
    } else {
      credentialsBar.style.display = "flex";
      accountLabel.innerText = "تسجيل الدخول";
    }
  }

  function toggleCredentialsForm() {
    if (credentialsBar.style.display === "none") {
      credentialsBar.style.display = "flex";
      userEmail.focus();
    } else {
      credentialsBar.style.display = "none";
    }
  }

  // تبديل إظهار / إخفاء كلمة المرور
  function togglePasswordVisibility() {
    if (userPassword.type === "password") {
      userPassword.type = "text";
      togglePasswordBtn.innerText = "🙈";
    } else {
      userPassword.type = "password";
      togglePasswordBtn.innerText = "👁️";
    }
  }

  window.addEventListener("DOMContentLoaded", initUserSession);

  fileInput.addEventListener("change", (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      if (attachedFiles.length < 3) attachedFiles.push(file);
    });
    updatePreviewBar();
  });

  function updatePreviewBar() {
    previewBar.innerHTML = "";
    if (attachedFiles.length === 0) {
      previewBar.style.display = "none";
      return;
    }
    previewBar.style.display = "flex";
    attachedFiles.forEach((file, index) => {
      const chip = document.createElement("div");
      chip.className = "attached-chip";
      chip.innerHTML = `<span>📷 ${file.name.substring(0, 14)}...</span><button onclick="removeAttached(${index})">✕</button>`;
      previewBar.appendChild(chip);
    });
  }

  function removeAttached(index) {
    attachedFiles.splice(index, 1);
    updatePreviewBar();
  }

  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  async function sendMessage() {
    const text = questionInput.value.trim();
    if (!text && attachedFiles.length === 0) return;

    const email = userEmail.value.trim();
    const password = userPassword.value.trim();

    if (!email || !password) {
      alert("برجاء إدخال البريد الإلكتروني وكلمة المرور أولاً.");
      credentialsBar.style.display = "flex";
      userEmail.focus();
      return;
    }

    localStorage.setItem("quickask_email", email);
    localStorage.setItem("quickask_password", password);
    initUserSession();

    appendMessage(text, "user");
    questionInput.value = "";

    const tempBotId = "msg-" + Date.now();
    appendMessage("جاري كتابة الرد...", "bot", tempBotId, false);

    sendBtn.disabled = true;

    try {
      const formData = new FormData();
      formData.append("username", email);
      formData.append("password", password);
      formData.append("question", text || "none");

      attachedFiles.forEach((file, i) => {
        formData.append(`photo_${i + 1}`, file);
      });

      const response = await fetch(N8N_WEBHOOK_URL, {
        method: "POST",
        body: formData
      });

      const resultText = await response.text();

      updateMessageContent(tempBotId, resultText);

      attachedFiles = [];
      updatePreviewBar();

    } catch (err) {
      updateMessageContent(tempBotId, "<span style='color: #ea0038; font-weight: bold;'>تعذر الاتصال بالخادم، تأكد من اتصال الإنترنت ثم حاول ثانية.</span>");
    } finally {
      sendBtn.disabled = false;
      questionInput.focus();
    }
  }

  function appendMessage(content, role, id = null, showTicks = true) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;
    if (id) row.id = id;

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";

    const contentDiv = document.createElement("div");
    contentDiv.className = "bubble-content";
    contentDiv.innerHTML = content;

    const meta = document.createElement("div");
    meta.className = "bubble-meta";

    const time = document.createElement("span");
    time.className = "msg-time";
    time.innerText = getCurrentTimeString();
    meta.appendChild(time);

    if (role === "user" && showTicks) {
      const ticks = document.createElement("span");
      ticks.className = "ticks";
      ticks.innerText = " ✓✓";
      meta.appendChild(ticks);
    }

    bubble.appendChild(contentDiv);
    bubble.appendChild(meta);
    row.appendChild(bubble);

    chatMessages.appendChild(row);
    scrollToBottom();
  }

  function updateMessageContent(id, newContent) {
    const row = document.getElementById(id);
    if (row) {
      const contentDiv = row.querySelector(".bubble-content");
      if (contentDiv) contentDiv.innerHTML = newContent;
      scrollToBottom();
    }
  }

  function getCurrentTimeString() {
    const now = new Date();
    return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
</script>

</body>
</html>
