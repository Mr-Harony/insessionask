<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr Harony Quick Ask - Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 850px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    /* Header */
    .chat-header {
      padding: 16px 20px;
      background-color: #1a2234;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-header span {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* Login / Account Bar */
    .user-bar {
      padding: 10px 16px;
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    .user-bar input {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      outline: none;
      text-align: left;
      direction: ltr;
    }

    .user-bar input:focus {
      border-color: #4f46e5;
    }

    /* Messages Area */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }

    .message.user {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message.bot {
      align-self: flex-end;
      align-items: flex-end;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background-color: #3b82f6;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message.bot .bubble {
      background-color: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 2px;
    }

    .message-time {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Attached image preview inside bubble */
    .bubble img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
    }

    /* Input & Action Area */
    .chat-input-area {
      padding: 14px 16px;
      background-color: #1a2234;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .image-preview-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .image-tag {
      background-color: #334155;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .image-tag button {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      resize: none;
      height: 48px;
      font-size: 0.9rem;
      outline: none;
      line-height: 1.4;
    }

    textarea:focus {
      border-color: #4f46e5;
    }

    .btn-icon {
      background-color: #334155;
      border: 1px solid #475569;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
    }

    .btn-send {
      background-color: #4f46e5;
      border: none;
      color: #fff;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      height: 48px;
      font-size: 0.9rem;
    }

    .btn-send:hover {
      background-color: #4338ca;
    }

    .btn-send:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    /* Scrollbar styling */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="chat-card">
  <!-- Header -->
  <div class="chat-header">
    <h1>Mr Harony Quick Ask ⚛️</h1>
    <span>Cambridge IGCSE Physics</span>
  </div>

  <!-- Credentials -->
  <div class="user-bar">
    <input type="email" id="userEmail" placeholder="Username (email)" value="Try@try.com" />
    <input type="password" id="userPassword" placeholder="Password" value="12345678" />
  </div>

  <!-- Chat History / Messages -->
  <div class="chat-messages" id="chatMessages">
    <!-- Initial welcome message -->
    <div class="message bot">
      <div class="bubble">أهلاً بك 👋 اكتب سؤالك العلمي في فيزياء IGCSE، وسأجيبك فوراً مع تذكر تفاصيل محادثتنا الحالية.</div>
      <span class="message-time">النظام</span>
    </div>
  </div>

  <!-- Input Area -->
  <div class="chat-input-area">
    <!-- Attached Images Names -->
    <div class="image-preview-bar" id="imagePreviewBar" style="display: none;"></div>

    <div class="input-row">
      <label class="btn-icon" title="إرفاق صورة">
        📷
        <input type="file" id="fileInput" accept="image/*" style="display: none;" multiple />
      </label>
      
      <textarea id="questionInput" placeholder="اكتب سؤالك هنا..."></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>
  </div>
</div>

<script>
  // الرابط الخاص بنود Webhook في n8n (استبدله برابط الـ Production Webhook الخاص بك)
  const N8N_WEBHOOK_URL = "https://YOUR_N8N_DOMAIN/webhook/quick-ask";

  const chatMessages = document.getElementById("chatMessages");
  const questionInput = document.getElementById("questionInput");
  const userEmail = document.getElementById("userEmail");
  const userPassword = document.getElementById("userPassword");
  const fileInput = document.getElementById("fileInput");
  const imagePreviewBar = document.getElementById("imagePreviewBar");
  const sendBtn = document.getElementById("sendBtn");

  let attachedFiles = [];

  // التعامل مع اختيار الصور
  fileInput.addEventListener("change", (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      if (attachedFiles.length < 3) {
        attachedFiles.push(file);
      }
    });
    updateImagePreview();
  });

  function updateImagePreview() {
    imagePreviewBar.innerHTML = "";
    if (attachedFiles.length === 0) {
      imagePreviewBar.style.display = "none";
      return;
    }
    imagePreviewBar.style.display = "flex";
    attachedFiles.forEach((file, index) => {
      const tag = document.createElement("div");
      tag.className = "image-tag";
      tag.innerHTML = `<span>${file.name.substring(0, 15)}...</span><button onclick="removeFile(${index})">✕</button>`;
      imagePreviewBar.appendChild(tag);
    });
  }

  function removeFile(index) {
    attachedFiles.splice(index, 1);
    updateImagePreview();
  }

  // دعم الإرسال بزر Enter (مع Shift+Enter لسطر جديد)
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  async function sendMessage() {
    const text = questionInput.value.trim();
    if (!text && attachedFiles.length === 0) return;

    const email = userEmail.value.trim();
    const password = userPassword.value.trim();

    if (!email) {
      alert("برجاء إدخال البريد الإلكتروني أولاً.");
      return;
    }

    // 1. إضافة فقاعة المستخدم في الشات
    appendMessage(text, "user");
    questionInput.value = "";

    // 2. إضافة فقاعة تحميل مؤقتة للمساعد
    const tempBotMsgId = "loading-" + Date.now();
    appendMessage("جاري التفكير وتحليل السؤال...", "bot", tempBotMsgId);

    sendBtn.disabled = true;

    try {
      // إرسال البيانات كـ FormData لدعم الصور والنصوص معاً
      const formData = new FormData();
      formData.append("username", email);
      formData.append("password", password);
      formData.append("question", text || "none");

      attachedFiles.forEach((file, i) => {
        formData.append(`photo_${i + 1}`, file);
      });

      const response = await fetch(N8N_WEBHOOK_URL, {
        method: "POST",
        body: formData
      });

      const resultText = await response.text();

      // 3. استبدال فقاعة التحميل بالإجابة القادمة من n8n
      updateBotMessage(tempBotMsgId, resultText);

      // مسح الصور المرفقة بعد الإرسال الناجح
      attachedFiles = [];
      updateImagePreview();

    } catch (error) {
      updateBotMessage(tempBotMsgId, "<span style='color: #ef4444; font-weight: bold;'>حدث خطأ في الاتصال بالخادم. برجاء المحاولة لاحقاً.</span>");
    } finally {
      sendBtn.disabled = false;
      questionInput.focus();
    }
  }

  function appendMessage(content, sender, id = null) {
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${sender}`;
    if (id) msgDiv.id = id;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    // استخدام innerHTML حتى تظهر التنسيقات (مثل الخط العريض والأحمر) القادمة من n8n
    bubble.innerHTML = content;

    const time = document.createElement("span");
    time.className = "message-time";
    const now = new Date();
    time.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    msgDiv.appendChild(bubble);
    msgDiv.appendChild(time);
    chatMessages.appendChild(msgDiv);

    scrollToBottom();
  }

  function updateBotMessage(id, newContent) {
    const msgDiv = document.getElementById(id);
    if (msgDiv) {
      const bubble = msgDiv.querySelector(".bubble");
      bubble.innerHTML = newContent;
      scrollToBottom();
    }
  }

  function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
</script>

</body>
</html>
