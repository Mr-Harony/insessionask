<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mr Harony - Quick Ask</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #eae6df;
      color: #111b21;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Container */
    .whatsapp-container {
      background-color: #efeae2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 600px) {
      .whatsapp-container {
        max-width: 500px;
        height: 94vh;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        border: 1px solid #d1d7db;
      }
    }

    /* Header */
    .chat-header {
      background-color: #f0f2f5;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e9edef;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #25d366;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: bold;
    }

    .header-text h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #111b21;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 0.76rem;
      color: #667781;
    }

    .btn-account-pill {
      background-color: #ffffff;
      border: 1px solid #d1d7db;
      color: #54656f;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Credentials */
    .credentials-bar {
      background-color: #ffffff;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #e9edef;
      flex-shrink: 0;
    }

    .credentials-bar input {
      background-color: #f0f2f5;
      border: 1px solid #d1d7db;
      border-radius: 8px;
      padding: 7px 10px;
      color: #111b21;
      font-size: 0.82rem;
      outline: none;
      text-align: left;
    }

    .credentials-bar input:focus {
      border-color: #00a884;
    }

    #userEmail {
      flex: 1.2;
    }

    .password-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      width: 100%;
      padding-right: 32px;
    }

    .toggle-password-btn {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      color: #54656f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      user-select: none;
    }

    /* Feed */
    .chat-messages {
      flex: 1;
      background-color: #efeae2;
      background-image: 
        radial-gradient(#d4cdc2 1px, transparent 1px),
        radial-gradient(#d4cdc2 1px, #efeae2 1px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-row {
      display: flex;
      width: 100%;
      margin-bottom: 4px;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.bot {
      justify-content: flex-start;
    }

    .msg-bubble {
      max-width: 84%;
      padding: 7px 10px 5px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
    }

    .msg-row.user .msg-bubble {
      background-color: #d9fdd3;
      color: #111b21;
      border-top-right-radius: 0px;
      border-top-left-radius: 8px;
    }

    .msg-row.bot .msg-bubble {
      background-color: #ffffff;
      color: #111b21;
      border-top-left-radius: 0px;
      border-top-right-radius: 8px;
    }

    .bubble-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 3px;
      margin-top: 3px;
      font-size: 0.67rem;
      color: #667781;
    }

    .ticks {
      color: #53bdeb;
      font-size: 0.72rem;
      font-weight: bold;
    }

    /* Attachments */
    .attachment-preview-bar {
      background-color: #f0f2f5;
      padding: 6px 12px;
      display: flex;
      gap: 6px;
      border-top: 1px solid #e9edef;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .attached-chip {
      background-color: #ffffff;
      border: 1px solid #d1d7db;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #111b21;
    }

    .attached-chip button {
      background: none;
      border: none;
      color: #ea0038;
      font-weight: bold;
      cursor: pointer;
    }

    /* Footer */
    .chat-footer {
      background-color: #f0f2f5;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      border-top: 1px solid #e9edef;
    }

    .btn-attach {
      background: none;
      border: none;
      color: #54656f;
      font-size: 1.35rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .footer-input {
      flex: 1;
      background-color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      color: #111b21;
      font-size: 0.92rem;
      outline: none;
      max-height: 90px;
      resize: none;
      line-height: 1.35;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
    }

    .footer-input::placeholder {
      color: #8696a0;
    }

    .btn-send-circle {
      background-color: #00a884;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.15rem;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    .btn-send-circle:hover {
      background-color: #029070;
    }

    .btn-send-circle:disabled {
      background-color: #8696a0;
      cursor: not-allowed;
    }

    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div class="whatsapp-container">
  <!-- Header -->
  <div class="chat-header">
    <div class="header-user-info">
      <div class="avatar">⚛️</div>
      <div class="header-text">
        <h2>Mr Harony Assistant</h2>
        <p>Cambridge IGCSE Physics • Online</p>
      </div>
    </div>
    <div>
      <button class="btn-account-pill" id="accountBtn" onclick="toggleCredentialsForm()" title="Account Settings">
        👤 <span id="accountLabel">Account</span>
      </button>
    </div>
  </div>

  <!-- Credentials -->
  <div class="credentials-bar" id="credentialsBar">
    <input type="email" id="userEmail" placeholder="Email / Username" autocomplete="username" />
    <div class="password-wrapper">
