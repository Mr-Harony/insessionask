<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr Harony - Quick Ask</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0c1317;
      color: #e9edef;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* الحاوية الأساسية للشات */
    .whatsapp-container {
      background-color: #111b21;
      width: 100%;
      max-width: 520px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid #222d34;
      border-right: 1px solid #222d34;
    }

    @media (min-width: 540px) {
      .whatsapp-container {
        height: 94vh;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
    }

    /* الشريط العلوي (WhatsApp Header) */
    .chat-header {
      background-color: #202c33;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222d34;
      z-index: 10;
    }

    .header-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #00a884;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .header-text h2 {
      font-size: 0.98rem;
      font-weight: 600;
      color: #e9edef;
    }

    .header-text p {
      font-size: 0.75rem;
      color: #8696a0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-account-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #8696a0;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.72rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-account-pill:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #e9edef;
    }

    /* نافذة أو بار إدخال البيانات المدمج */
    .credentials-bar {
      background-color: #182229;
      padding: 8px 14px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #222d34;
      align-items: center;
    }

    .credentials-bar input {
      flex: 1;
      background-color: #111b21;
      border: 1px solid #2a3942;
      border-radius: 8px;
      padding: 6px 10px;
      color: #e9edef;
      font-size: 0.8rem;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    .credentials-bar input:focus {
      border-color: #00a884;
    }

    /* منطقة الرسائل والخلفية بنمط واتساب */
    .chat-messages {
      flex: 1;
      background-color: #0b141a;
      background-image: radial-gradient(#182229 1px, transparent 1px);
      background-size: 16px 16px;
      padding: 16px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* فقاعات الرسائل */
    .msg-row {
      display: flex;
      width: 100%;
      margin-bottom: 2px;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.bot {
      justify-content: flex-start;
    }

    .msg-bubble {
      max-width: 82%;
      padding: 7px 10px 6px 10px;
      border-radius: 8px;
      position: relative;
      font-size: 0.88rem;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    /* لون فقاعة الطالب (أخضر واتساب) */
    .msg-row.user .msg-bubble {
      background-color: #005c4b;
      color: #e9edef;
      border-top-left-radius: 8px;
      border-top-right-radius: 0px;
    }

    /* لون فقاعة المساعد الأكاديمي */
    .msg-row.bot .msg-bubble {
      background-color: #202c33;
      color: #e9edef;
      border-top-left-radius: 0px;
      border-top-right-radius: 8px;
    }

    .bubble-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 3px;
      margin-top: 2px;
      font-size: 0.68rem;
      color: #8696a0;
      direction: ltr;
    }

    .ticks {
      color: #53bdeb; /* علامتي الصح الزرقاء */
      font-size: 0.72rem;
    }

    /* شريط معاينة الصور قبل الإرسال */
    .attachment-preview-bar {
      background-color: #182229;
      padding: 6px 14px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #222d34;
      overflow-x: auto;
    }

    .attached-chip {
      background-color: #202c33;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #e9edef;
    }

    .attached-chip button {
      background: none;
      border: none;
      color: #f15c6d;
      font-weight: bold;
      cursor: pointer;
    }

    /* شريط الكتابة السفلي (WhatsApp Footer) */
    .chat-footer {
      background-color: #202c33;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .btn-attach {
      background: none;
      border: none;
      color: #8696a0;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .btn-attach:hover {
      color: #aebac1;
    }

    .footer-input {
      flex: 1;
      background-color: #2a3942;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      color: #d1d7db;
      font-size: 0.9rem;
      outline: none;
      max-height: 100px;
      resize: none;
      line-height: 1.35;
    }

    .footer-input::placeholder {
      color: #8696a0;
    }

    .btn-send-circle {
      background-color: #00a884;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: #111b21;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    .btn-send-circle:hover {
      background-color: #06cf9c;
    }

    .btn-send-circle:disabled {
      background-color: #3b4a54;
      color: #8696a0;
      cursor: not-allowed;
    }

    /* تخصيص مظهر شريط التمرير */
    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div class="whatsapp-container">
  <!-- رأس المحادثة -->
  <div class="chat-header">
    <div class="header-user-info">
      <div class="avatar">⚛️</div>
      <div class="header-text">
        <h2>Mr Harony Assistant</h2>
        <p>Cambridge IGCSE Physics • متصل الآن</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-account-pill" id="accountBtn" onclick="toggleCredentialsForm()" title="إعدادات الحساب">
        👤 <span id="accountLabel">حسابي</span>
      </button>
    </div>
  </div>

  <!-- بيانات الحساب (تظهر تلقائياً لأول مرة أو عند الضغط على تغيير الحساب) -->
  <div class="credentials-bar" id="credentialsBar">
    <input type="email" id="userEmail" placeholder="البريد الإلكتروني (Username)" autocomplete="username" />
    <input type="password" id="userPassword" placeholder="كلمة المرور (Password)" autocomplete="current-password" />
  </div>

  <!-- صندوق رسائل الشات -->
  <div class="chat-messages" id="chatMessages">
    <!-- الرسالة الترحيبية الأولى بنمط فقاعة المساعد -->
    <div class="msg-row bot">
      <div class="msg-bubble">
